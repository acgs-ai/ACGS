# Marketing surface — Vercel deploy (DEPLOY.md §3, §7).
#
# Required secrets:
#   VERCEL_TOKEN          — token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID         — `vercel project ls` reveals it
#   VERCEL_PROJECT_ID     — same
#
# PR runs do a preview deploy and the URL is posted as a check; main runs
# do a production deploy.

name: marketing

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'infra/**'
      - '.github/workflows/console.yml'
      - 'DEPLOY.md'
  push:
    branches: [master]
    paths-ignore:
      - 'infra/**'
      - '.github/workflows/console.yml'
      - 'DEPLOY.md'

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (sanity check before Vercel takes over)
        run: pnpm build

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: |
          vercel build ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `marketing preview · ${{ steps.deploy.outputs.url }}`
            })
