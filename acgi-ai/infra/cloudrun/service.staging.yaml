# Cloud Run service template for the console origin — DEPLOY.md §7.
# Environment: staging
# Staging keeps one warm instance for pre-production smoke checks.
#
# Rendered by scripts/render-cloudrun-service.mjs into infra/cloudrun/service.yaml.
# Keep REPLACE_* placeholders; the deploy job substitutes image, build id,
# auth upstream and same-origin bus upstream at deploy time.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: acgi-console
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
    # Enable end-user logs to flow through to Cloud Logging.
    run.googleapis.com/cpu-throttling: "false"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - name: console
          image: REPLACE_AT_DEPLOY_TIME
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ACGI_BUILD_ID
              value: "REPLACE_BUILD_ID_AT_DEPLOY_TIME"
            - name: AUTH_UPSTREAM
              value: "REPLACE_AUTH_UPSTREAM_AT_DEPLOY_TIME"
            - name: BUS_UPSTREAM
              value: "REPLACE_BUS_UPSTREAM_AT_DEPLOY_TIME"
            - name: ACGS_SCHEMA_VERSION
              value: "v1"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100
