# Workers Static Assets deploy config for the LIVE acgs.ai origin.
#
# acgs.ai / www.acgs.ai are served by the Worker `acgs-governance-proxy`
# (Workers Static Assets), not the Pages project in ../../wrangler.toml —
# Worker routes shadow Pages. This config is what marketing-cloudflare.yml
# deploys with (`wrangler deploy --config infra/cloudflare/workers/wrangler.toml`).
#
# Routes are pinned HERE, not the dashboard. INCIDENT 2026-07-11: deploying
# with this config and no routes block DETACHED the dashboard routes (wrangler
# treats config triggers as source of truth when workers_dev = false) and
# 404'd the whole apex until routes were redeclared. Never remove this block;
# `--name`-style CLI deploys without a config preserve routes, config deploys
# do not.
#
# The deploy step stages infra/cloudflare/_headers and
# infra/cloudflare/workers/_redirects (Workers-compatible variant) into dist/
# before deploying. Do NOT stage the Pages ../_redirects here — Workers Assets
# rejects its 404-status rules and SPA catch-all.

name = "acgs-governance-proxy"
main = "worker.js"
compatibility_date = "2026-06-14"
workers_dev = false
routes = [
  { pattern = "acgs.ai/*", zone_name = "acgs.ai" },
  { pattern = "www.acgs.ai/*", zone_name = "acgs.ai" },
  { pattern = "console.acgs.ai/*", zone_name = "acgs.ai" },
  { pattern = "api.acgs.ai/telegram/*", zone_name = "acgs.ai" },
]

[assets]
directory = "../../../dist"
binding = "ASSETS"
# The script must see every request — without this, asset-matching paths
# (e.g. www.acgs.ai/) bypass worker.js and the www→apex 301 never fires.
run_worker_first = true
