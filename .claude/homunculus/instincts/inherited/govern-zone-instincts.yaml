# Govern Zone Workflow Add New Workspace Python Package

## Action

Follow the add-new-workspace-python-package workflow:
1. Create new package directory under packages/
2. Add pyproject.toml, README.md, .gitignore, and Makefile
3. Implement source files in src/{package_name}/
4. Add tests in tests/
5. Register package in root pyproject.toml [tool.uv.workspace].members
6. Update tests/test_monorepo_invariants.py to include the new member
7. Add or update .github/workflows/python-{package}.yml for CI

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: packages/{package}/pyproject.toml, packages/{package}/README.md, packages/{package}/src/{package}/__init__.py

