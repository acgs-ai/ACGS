# Govern Zone Workflow Add New Frontend Console Surface

## Action

Follow the add-new-frontend-console-surface workflow:
1. Create new route file in src/routes/console/
2. Register the route in src/routes/Console.tsx (and sometimes App.tsx)
3. Add/update API client in src/api/client.ts and types in src/api/types.ts
4. Add React Query hooks in src/api/hooks.ts
5. Add or update MSW mock data and handlers in src/mocks/data/ and src/mocks/handlers.ts
6. Add or update CSS in src/App.css
7. Add/extend invariant or smoke scripts in scripts/
8. Update package.json test scripts if needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: acgi-ai/src/routes/console/{Feature}.tsx, acgi-ai/src/routes/Console.tsx, acgi-ai/src/api/client.ts

