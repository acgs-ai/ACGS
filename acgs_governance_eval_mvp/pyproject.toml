[project]
name = "acgs-governance-eval-mvp"
version = "0.1.0"
description = "ACGS runtime governance evaluation MVP for AI agents"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "cryptography>=42.0"
]

# Setuptools auto-discovery refuses to proceed when multiple top-level
# packages exist in a flat-layout. This project now has two
# (`governance` and `governed_mcp_v0`), so list them explicitly. The
# `*` wildcards include subpackages without enumerating every one.
[tool.setuptools.packages.find]
include = ["governance*", "governed_mcp_v0*"]
namespaces = false

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.29"
]
dspy = [
  "dspy-ai>=2.5"
]
otel = [
  "opentelemetry-api>=1.24"
]
test = [
  "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "regression(pr, severity, issue, coverage_angle): regression test seed marker",
]

[tool.ruff]
# Override the monorepo root's `line-length = 100` for this package —
# eval-mvp predates the unified style and uses 120-char lines, mostly
# in test scenarios that read more clearly when not broken. Tightening
# back to 100 is a separate cleanup PR.
line-length = 120

[tool.ruff.lint]
# Per-rule pragma — none of these are introduced by this PR; they're
# pre-existing code that the CI lint step started flagging once the
# PEP 668 install fix let the step actually run:
#   B008   — fastapi/click idiom; Depends() / Argument() in defaults
#            is the documented pattern, not an anti-pattern here.
#   RUF012 — governance test scaffolding uses mutable class attrs as
#            fixture stores; ClassVar migration is out of scope.
#   UP028  — single occurrence; sweep in cleanup PR.
# RUF059 is intentionally NOT listed — the CI lint step pins
# `uvx ruff@0.8`, which predates RUF059 and errors on parsing an
# unknown selector. Newer local ruff (≥0.12) flags one occurrence
# we'll sweep in the cleanup PR.
ignore = ["B008", "RUF012", "UP028"]
