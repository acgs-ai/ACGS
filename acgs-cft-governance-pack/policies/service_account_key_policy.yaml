id: cft-service-account-key-policy
description: Service account key controls for CFT-managed projects and runners.
controls:
  - id: cft-deny-long-lived-service-account-keys
    description: Long-lived service account keys are denied; use workload identity federation instead.
    severity: critical
    resource_types:
      - google_service_account_key
    rule:
      kind: deny_service_account_keys

  - id: cft-deny-broad-iam-roles
    description: Broad primitive roles must not be assigned by CFT plans.
    severity: critical
    resource_types:
      - google_project_iam_binding
      - google_project_iam_member
      - google_folder_iam_binding
      - google_folder_iam_member
      - google_organization_iam_binding
      - google_organization_iam_member
    rule:
      kind: deny_iam_roles
      roles:
        - roles/editor
        - roles/owner
