[project]
name = "acgs-cft-governance-pack"
version = "0.1.0"
description = "ACGS companion policy and evidence pack for Google Cloud Foundation Toolkit Terraform plans"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]

[project.scripts]
acgs-cft-govern = "acgs_cft_governance_pack.cli:main"

[tool.setuptools]
# Explicit list — setuptools' flat-layout autodiscovery walks every
# top-level dir (ci/, evidence/, examples/, policies/, tests/) and
# refuses to guess which one is the package. Naming it stops the
# `Multiple top-level packages discovered` failure.
packages = ["acgs_cft_governance_pack"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Same pre-existing-code rationale as acgs_governance_eval_mvp/pyproject.toml.
# Override the monorepo root's strict `line-length = 100` for this package
# until a cleanup PR rewrites the long lines (mostly in tests/).
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true
files = ["acgs_cft_governance_pack", "tests"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
