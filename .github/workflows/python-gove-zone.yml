# Path-filtered CI for packages/gove-zone/ — minimal governed agent runtime.
# Triggers only when the kernel package, the workspace pyproject, or this
# workflow change. No submodule init needed: gove-zone is a first-class
# in-tree package, not a gitlink.

name: python-gove-zone

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/gove-zone/**'
      - '.claude/policy/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/python-gove-zone.yml'
  push:
    branches: [master]
    paths:
      - 'packages/gove-zone/**'
      - '.claude/policy/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/python-gove-zone.yml'

concurrency:
  group: python-gove-zone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/gove-zone

jobs:
  test:
    # Block fork PRs: untrusted code must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Clear stale content from the uninitialized control-plane gitlink
        # packages/acgs-control-plane is a private submodule (#429) that this
        # lane deliberately never initializes, yet it is a uv workspace member.
        # uv tolerates an EMPTY member directory (uninitialized submodule) but
        # hard-fails when the directory is non-empty without a pyproject.toml.
        # On persistent self-hosted runners the directory keeps pre-extraction
        # leftovers that checkout's clean skips (git clean does not descend
        # into gitlink paths), which broke workspace resolution here. Reset it
        # to the empty uninitialized state; never touch a real checkout.
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d packages/acgs-control-plane ] && [ ! -f packages/acgs-control-plane/pyproject.toml ]; then
            rm -rf packages/acgs-control-plane
            mkdir packages/acgs-control-plane
          fi

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/gove-zone/pyproject.toml'

      - name: Install (dev + schema extras)
        # Standalone CI: no parent uv workspace context. The package
        # declares zero runtime deps and an optional pydantic via
        # [project.optional-dependencies].schema. Use uv's python-build-standalone
        # toolchain because actions/setup-python has no prebuilds for Ubuntu
        # 25.10 on the self-hosted runner.
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python --no-config --editable '.[dev,schema,mcp,yaml]'

      - name: Lint
        run: |
          .venv/bin/python -m ruff check src tests examples
          .venv/bin/python -m ruff format --check src tests examples

      - name: Test
        # `--import-mode=importlib` matches the package's pytest config and
        # keeps tests insulated from sys.path leakage from sibling packages.
        # Coverage floor: the kernel sits on the critical "no valid receipt, no
        # side effect" path, so a regression that silently drops a tested branch
        # must fail CI. 90% is a deliberate floor below the ~91% actual (leaving
        # headroom for platform-specific branches: the Windows msvcrt audit lock
        # and the no-crypto-extra ImportError paths are unreachable on this
        # Linux+crypto runner). The `mcp` extra is installed above so the
        # governed-MCP gateway (adapters/mcp_gateway.py) is exercised by its
        # conformance suite here rather than skipped — without it the gateway
        # sits at ~43% and drags the total under the floor. Raise the floor as
        # coverage climbs; never lower it to make a red build pass.
        run: >
          .venv/bin/python -m pytest tests/ -v
          --cov=gove_zone
          --cov-report=term-missing:skip-covered
          --cov-fail-under=90

      - name: Fail-closed deny-path coverage gate (kernel, 100%)
        # G1.3: the kernel is the deny-synthesis module — it turns policy
        # DENY/ESCALATE/malformed-TRANSFORM and audit/exec failures into
        # fail-closed outcomes. A single uncovered deny line is a hole in the
        # fail-closed guarantee, so this gate demands 100% statement + branch
        # coverage on gove_zone.kernel specifically. Separate from the 90%
        # whole-package floor above so the deny-path contract is enforced on
        # its own axis and can never be diluted by the wider package average.
        run: >
          .venv/bin/python -m pytest tests/
          --cov=gove_zone.kernel
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
          -q

      - name: LangChain adapter lane (installed langchain extra)
        # The main venv above deliberately omits the declared `langchain`
        # extra so the missing-dependency guards in
        # test_langgraph_adapter_guards.py exercise a real absence. Without
        # this lane, LANGCHAIN_AVAILABLE stayed false everywhere in CI and the
        # installed GovernedTool path — attribute mapping and governed
        # `_run`/`_arun` dispatch — could regress while the gate stayed green.
        # A second venv installs the extra and runs the positive and deny-path
        # adapter assertions against it.
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-langchain
          uv pip install --python .venv-langchain/bin/python --no-config --editable '.[dev,langchain]'
          .venv-langchain/bin/python -m pytest tests/test_framework_adapters.py tests/test_langgraph_adapter_guards.py -v --import-mode=importlib

      - name: ADR-0005 propagation budget gate
        # G1.5: the ADR-0005 propagation-overhead budget was a stale, uncollected
        # artifact — `benchmarks/` sits outside the package `testpaths`, so nothing
        # ran the budget test and a perf regression failed no gate. Wire it live
        # here: the threshold gate proves propagation stays within the overhead
        # budget, and the artifact-integrity guard proves the committed verdict
        # artifact has not drifted from the in-code THRESHOLDS. Linux self-hosted
        # only — perf noise makes the macOS/Windows matrix meaningless for this
        # gate. Additive: does not touch the coverage floors or gating above.
        run: >
          .venv/bin/python -m pytest
          benchmarks/test_propagation_overhead.py
          benchmarks/test_artifact_integrity.py
          -q

  cross-platform-lock:
    # Cross-platform proof for the stdlib audit-lock branch (POSIX ``fcntl`` /
    # Windows ``msvcrt``) and the OS-agnostic concurrent-writer test. The
    # self-hosted `test` job above is Linux-only and owns lint + the 90%
    # coverage floor; this job runs on GitHub-hosted macOS and Windows so the
    # Windows ``msvcrt`` lock branch — unreachable on the Linux runner — is
    # actually exercised. No coverage floor here: platform-specific branches
    # make a shared floor meaningless off the Linux+crypto reference runner.
    #
    # Same fork-guard as the Linux job: never run untrusted fork-PR code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, blacksmith-4vcpu-windows-2025]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/gove-zone/pyproject.toml'
      - name: Test (cross-platform audit lock + concurrent writers)
        # `shell: bash` on every OS (Git Bash on the Windows runner) so one
        # script works everywhere; the venv interpreter lives at .venv/bin on
        # POSIX and .venv/Scripts on Windows, resolved below. Standalone install
        # (no `uv sync`) mirrors the Linux job: gove-zone is a first-class
        # in-tree package with zero runtime deps, so no submodule init or
        # workspace resolution is needed. dev+crypto extras match the local
        # validation command; the concurrent test launches subprocess writers
        # that exercise THIS platform's real audit-lock branch.
        shell: bash
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }} .venv
          VENV_PY="$([ -x .venv/bin/python ] && echo .venv/bin/python || echo .venv/Scripts/python.exe)"
          uv pip install --python "$VENV_PY" --no-config --editable '.[dev,crypto]'
          "$VENV_PY" -m pytest tests/test_audit_chain.py tests/test_locking_reexport.py -v --import-mode=importlib

  wheel-smoke:
    # Release-readiness gate (G1.1): build the wheel, install it ALONE into a
    # throwaway venv (no extras, no --editable), and prove `gove-zone smoke`
    # exits 0 with status=pass. This is the continuous form of the release
    # verify step — it catches an accidental runtime import of an optional
    # extra (which the editable `test` job above would mask) on every PR.
    # Independent of `test`; it does NOT replace or weaken the 90% coverage gate.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    # Build + clean install must resolve from the workspace root, not the
    # package dir, so override the workflow-level default here.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Clear stale content from the uninitialized control-plane gitlink
        # Same reset as the `test` job above: uv workspace resolution (used by
        # `uv build --package gove-zone` in the smoke script) requires the
        # uninitialized private submodule directory to be empty.
        run: |
          if [ -d packages/acgs-control-plane ] && [ ! -f packages/acgs-control-plane/pyproject.toml ]; then
            rm -rf packages/acgs-control-plane
            mkdir packages/acgs-control-plane
          fi
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/gove-zone/pyproject.toml'
      - name: Clean-venv wheel smoke
        # Mirrors the `test` job's uv toolchain preamble. The script itself runs
        # `uv python install 3.12` and `uv build --package gove-zone`.
        run: bash packages/gove-zone/scripts/release_smoke_check.sh

  dist-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/gove-zone/pyproject.toml'
      - name: Build + install-smoke the distribution
        run: bash scripts/release_check.sh
