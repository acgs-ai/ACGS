# Hash-locked, GitHub-hosted CI for the gove-zone execution membrane.
# The canonical cross-scope order lives in saas-beta-required.yml; this workflow
# preserves the package status context without offering a weaker green path.

name: python-gove-zone

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/gove-zone/**'
      - 'requirements/saas-beta/gz-test.lock'
      - 'requirements/saas-beta/locks.toml'
      - '.claude/policy/**'
      - 'pyproject.toml'
      - '.github/workflows/python-gove-zone.yml'
  push:
    branches: [master]
    paths:
      - 'packages/gove-zone/**'
      - 'requirements/saas-beta/gz-test.lock'
      - 'requirements/saas-beta/locks.toml'
      - '.claude/policy/**'
      - 'pyproject.toml'
      - '.github/workflows/python-gove-zone.yml'

concurrency:
  group: python-gove-zone-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/packages/gove-zone/.venv-beta
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up uv 0.11.19
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.19'
          enable-cache: false

      - name: Install the reviewed hash-locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.11 packages/gove-zone/.venv-beta
          uv pip sync --python packages/gove-zone/.venv-beta/bin/python --require-hashes requirements/saas-beta/gz-test.lock
          UV_OFFLINE=1 UV_NO_INDEX=1 UV_NO_CACHE=1 uv pip install --python packages/gove-zone/.venv-beta/bin/python --no-build-isolation --no-deps --editable packages/gove-zone

      - name: Lint
        run: uv run --active --no-sync --python 3.11 --package gove-zone ruff check packages/gove-zone/src packages/gove-zone/tests packages/gove-zone/examples

      - name: Format
        run: uv run --active --no-sync --python 3.11 --package gove-zone ruff format --check packages/gove-zone/src packages/gove-zone/tests packages/gove-zone/examples

      - name: Typecheck
        run: uv run --active --no-sync --python 3.11 --package gove-zone mypy packages/gove-zone/src/gove_zone

      - name: Test and coverage
        run: uv run --active --no-sync --python 3.11 --package gove-zone python -m pytest packages/gove-zone/tests --import-mode=importlib -q --cov=gove_zone --cov-fail-under=90
