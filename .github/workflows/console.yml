# Console verification — no deployment authority.
#
# Pull requests execute only on an ephemeral GitHub-hosted runner with a
# read-only token. Production publication and Cloud Run deployment live in the
# push-only console-deploy.yml workflow.

name: console

on:
  pull_request:
    branches: [master]
    paths:
      - 'acgi-ai/src/**'
      - 'acgi-ai/public/**'
      - 'acgi-ai/index.html'
      - 'acgi-ai/package.json'
      - 'acgi-ai/pnpm-lock.yaml'
      - 'acgi-ai/pnpm-workspace.yaml'
      - 'acgi-ai/scripts/**'
      - 'acgi-ai/contracts/**'
      - 'acgi-ai/tests/**'
      - 'acgi-ai/playwright.config.ts'
      - 'acgi-ai/vite.config.ts'
      - 'acgi-ai/tsconfig*.json'
      - 'acgi-ai/infra/**'
      - 'acgi-ai/DEPLOY.md'
      - 'acgi-ai/PRODUCTION-LAUNCH.md'
      - 'acgi-ai/production-authority.example.json'
      - 'acgi-ai/production-evidence.example.json'
      - 'acgi-ai/hosted-storybook-proof.example.json'
      - 'acgi-ai/storybook-runtime.plan.json'
      - 'acgi-ai/A11Y.md'
      - 'acgi-ai/ARCHITECTURE.md'
      - 'acgi-ai/INTEGRATING.md'
      - 'acgi-ai/GETTING_STARTED.md'
      - 'docs/integration-readiness-task-map.md'
      - '.github/workflows/console.yml'
      - '.github/workflows/console-deploy.yml'

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REVIEWED_PNPM_SELECTOR: 'pnpm@9.15.4+sha512.b2dc20e2fc72b3e18848459b37359a32064663e5627a51e4c74b2c29dd8e8e0491483c3abb40789cfd578bf362fb6ba8261b05f0387d76792ed6e23ea3b1b6a0'

defaults:
  run:
    working-directory: acgi-ai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Activate integrity-verified pnpm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = '24.18.0'
          test "$(node -p "require('./package.json').packageManager")" = "$REVIEWED_PNPM_SELECTOR"
          corepack_root="$RUNNER_TEMP/acgs-corepack"
          rm -rf "$corepack_root"
          install -d -m 0700 "$corepack_root/home" "$corepack_root/bin"
          export COREPACK_HOME="$corepack_root/home"
          corepack enable --install-directory "$corepack_root/bin"
          export PATH="$corepack_root/bin:$PATH"
          test "$(corepack pnpm --version)" = '9.15.4'
          test "$(pnpm --version)" = '9.15.4'
          test "$(command -v pnpm)" = "$corepack_root/bin/pnpm"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$corepack_root/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Gate 1 - lint
        run: pnpm lint

      - name: Gate 2 - build
        run: pnpm build

      - name: Gate 3 - readiness
        run: pnpm test:all

      - name: Gate 4 - unit suite
        run: pnpm test:unit

      - name: Build buyer evidence gallery artifact
        run: pnpm evidence:build

      - name: Upload buyer evidence gallery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buyer-evidence-gallery
          path: acgi-ai/dist-buyer-evidence
          if-no-files-found: error

  browser-checks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Activate integrity-verified pnpm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = '24.18.0'
          test "$(node -p "require('./package.json').packageManager")" = "$REVIEWED_PNPM_SELECTOR"
          corepack_root="$RUNNER_TEMP/acgs-corepack"
          rm -rf "$corepack_root"
          install -d -m 0700 "$corepack_root/home" "$corepack_root/bin"
          export COREPACK_HOME="$corepack_root/home"
          corepack enable --install-directory "$corepack_root/bin"
          export PATH="$corepack_root/bin:$PATH"
          test "$(corepack pnpm --version)" = '9.15.4'
          test "$(pnpm --version)" = '9.15.4'
          test "$(command -v pnpm)" = "$corepack_root/bin/pnpm"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$corepack_root/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Gate 5 - browser suite
        run: pnpm test:playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: acgi-ai/playwright-report
          if-no-files-found: ignore
