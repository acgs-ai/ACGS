# Tag-triggered PyPI release for packages/gove-zone via OIDC Trusted
# Publishing. ADDITIVE workflow — it does not alter any existing CI gate.
#
# Fail-closed publish boundary:
#   - Two jobs. `build` runs immediately on the tag and proves the artifact
#     (`uv build` + `twine check`) BEFORE any human is asked to approve. The
#     `publish` job is gated behind `environment: production`, so the actual
#     upload only runs after the required human reviewer approves — the same
#     human-gate convention console.yml uses for the privileged Cloud Run push.
#     NOTE: this gate is only enforced once a human configures required
#     reviewers on the `production` environment in repo settings; until then
#     GitHub treats it as decorative and a v* tag would publish unreviewed.
#   - No long-lived PyPI API token and no secrets live in this file. Upload
#     authenticates with a short-lived OIDC token (`id-token: write`, scoped to
#     the publish job only) against a PyPI Trusted Publisher.
#
# Scope: gove-zone only. acgs-lite is an independent nested repo (a submodule,
# not checked out in this tree) and publishes from its own repository; mirroring
# its release here would cross that boundary, so it is a deliberate follow-up.
#
# Build uses uv's python-build-standalone toolchain (uv python install + uv
# build) rather than actions/setup-python, which has no prebuilds for the
# self-hosted runner — matching python-gove-zone.yml.

name: release

on:
  push:
    tags:
      - 'v*'

# Least privilege at the top: read-only by default. The publish job widens to
# id-token: write for OIDC; no other job gets it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + twine check (gove-zone)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/gove-zone/pyproject.toml'

      - name: Build sdist + wheel
        # `uv build --package gove-zone` resolves the workspace member and
        # writes artifacts to the workspace-root `dist/`. uv ships its own
        # interpreter toolchain, so no setup-python is required.
        run: |
          uv python install 3.12
          uv build --package gove-zone

      - name: twine check
        # Validates README rendering + PyPI metadata on the tag BEFORE the
        # human approval gate — a malformed artifact fails here, not after a
        # reviewer has already approved the upload.
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: gove-zone-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    # GitHub-hosted, NOT self-hosted. pypa/gh-action-pypi-publish is a Docker
    # container action; on the self-hosted runner it fails before the OIDC
    # exchange with `Permission denied: /github/workspace/dist` (the container
    # runs as root while the workspace is owned by the runner user). GitHub's
    # OIDC Trusted Publishing is only reliably supported on GitHub-hosted
    # runners, which is also where this action is tested. Free for this public
    # repo. The build job above stays self-hosted (it only runs uv, no
    # container action) so no toolchain assumptions change there.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` makes GitHub require the configured human
    # reviewer to approve before this job runs (once required reviewers are
    # configured — see header note). The actual PyPI upload — the only
    # irreversible side effect — never fires without that approval.
    environment: production
    # OIDC token minted only for this job; build above stays read-only.
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: gove-zone-dist
          path: dist/

      - name: Publish to PyPI
        # Short-lived OIDC credential against a PyPI Trusted Publisher. No API
        # token, no secrets. The Trusted Publisher on PyPI must be registered
        # to match: project gove-zone, repo dislovelhl/ACGS, workflow
        # release.yml, environment production.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
