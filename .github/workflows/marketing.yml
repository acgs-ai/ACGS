# Marketing surface — Vercel deploy (DEPLOY.md §3, §7).
#
# Required secrets:
#   VERCEL_TOKEN          — token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID         — `vercel project ls` reveals it
#   VERCEL_PROJECT_ID     — same
#
# PR runs do a preview deploy and the URL is posted as a check; pushes to
# master do a production deploy.
#
# Workflow lives at repo root (.github/workflows/) — GitHub Actions only
# discovers workflows from there. The acgi-ai app is in a subdirectory, so
# defaults.run.working-directory pins all `run:` steps there. Path filters
# are repo-root relative.

name: marketing

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'acgi-ai/infra/**'
      - '.github/workflows/console.yml'
      - 'acgi-ai/DEPLOY.md'
  push:
    branches: [master]
    paths-ignore:
      - 'acgi-ai/infra/**'
      - '.github/workflows/console.yml'
      - 'acgi-ai/DEPLOY.md'

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

defaults:
  run:
    working-directory: acgi-ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No `version:` here — read it from root package.json's
        # `packageManager` field. action-setup@v4 errors on duplicate
        # version declarations now that the monorepo root pins pnpm.

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: acgi-ai/pnpm-lock.yaml

      # `--ignore-workspace` keeps acgi-ai installed against its own
      # pnpm-lock.yaml. See console.yml for the full rationale.
      - run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Lint
        run: pnpm lint

      - name: Build (sanity check before Vercel takes over)
        run: pnpm build

      # ---- Vercel deploy: master pushes only ----
      # Originally this pipeline did a preview deploy on PRs too. That
      # requires VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID secrets;
      # when any are missing, vercel pull aborts with "No existing
      # credentials found." Gating to push events keeps PRs unblocked.
      # To re-enable PR previews, configure the three secrets and drop
      # the four `if:` lines below.
      - name: Install Vercel CLI
        if: github.event_name == 'push'
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        if: github.event_name == 'push'
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        if: github.event_name == 'push'
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: github.event_name == 'push'
        run: |
          URL=$(vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
