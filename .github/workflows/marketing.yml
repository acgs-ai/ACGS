# Marketing verification — no deployment authority.
#
# The live Cloudflare Workers Assets deployment is physically isolated in the
# push-only marketing-cloudflare.yml workflow.

name: marketing

on:
  pull_request:
    branches: [master]
    paths:
      - 'acgi-ai/**'
      - '!acgi-ai/infra/Caddyfile'
      - '!acgi-ai/infra/Dockerfile.console'
      - '!acgi-ai/infra/cloudrun/**'
      - '.github/workflows/marketing.yml'
      - '.github/workflows/marketing-cloudflare.yml'

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: acgi-ai

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: acgi-ai/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: acgi-ai/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Readiness gate
        run: pnpm test:all

      # Rebuild the marketing surface in dist after test:all leaves the console
      # bundle there, then prove the live Workers Assets routing payload.
      - name: Build live marketing artifact
        run: pnpm run build:marketing

      - name: Verify Workers Assets headers and redirects
        run: |
          set -euo pipefail
          cp infra/cloudflare/_headers infra/cloudflare/workers/_redirects dist/
          test -f dist/_headers
          test -f dist/_redirects
          ! ls dist/CLAUDE.md dist/DEPLOY.md dist/AGENTS.md dist/DESIGN.md 2>/dev/null

      - name: Verify live Worker routes path by path
        run: |
          set -euo pipefail
          config='infra/cloudflare/workers/wrangler.toml'
          test "$(grep -cF '  { pattern = ' "$config")" -eq 4
          grep -Fqx '  { pattern = "acgs.ai/*", zone_name = "acgs.ai" },' "$config"
          grep -Fqx '  { pattern = "www.acgs.ai/*", zone_name = "acgs.ai" },' "$config"
          grep -Fqx '  { pattern = "console.acgs.ai/*", zone_name = "acgs.ai" },' "$config"
          grep -Fqx '  { pattern = "api.acgs.ai/telegram/*", zone_name = "acgs.ai" },' "$config"
