# Marketing surface — verification gate (DEPLOY.md §3, §7).
#
# Deploy moved to Cloudflare Pages: see marketing-cloudflare.yml. This workflow
# is now PR/verify-only — it runs the full marketing readiness gate (lint, build,
# test:all) on PRs and master pushes but does NOT deploy. Vercel was retired as
# the marketing provider; the old VERCEL_* secrets are no longer used here.
#
# Workflow lives at repo root (.github/workflows/) — GitHub Actions only
# discovers workflows from there. The acgi-ai app is in a subdirectory, so
# defaults.run.working-directory pins all `run:` steps there. Path filters
# are repo-root relative.
# not production deployment proof

name: marketing

on:
  pull_request:
    branches: [master]
    paths:
      - 'acgi-ai/**'
      - '!acgi-ai/infra/**'
      - '!acgi-ai/DEPLOY.md'
  push:
    branches: [master]
    paths:
      - 'acgi-ai/**'
      - '!acgi-ai/infra/**'
      - '!acgi-ai/DEPLOY.md'

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: acgi-ai

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No `version:` here — read it from root package.json's
        # `packageManager` field. action-setup@v4 errors on duplicate
        # version declarations now that the monorepo root pins pnpm.

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: acgi-ai/pnpm-lock.yaml

      # `--ignore-workspace` keeps acgi-ai installed against its own
      # pnpm-lock.yaml. See console.yml for the full rationale.
      - run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Readiness gate
        run: pnpm test:all
