# Marketing surface — Vercel deploy (DEPLOY.md §3, §7).
#
# Required secrets:
#   VERCEL_TOKEN          — token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID         — `vercel project ls` reveals it
#   VERCEL_PROJECT_ID     — same
#
# PR runs do a preview deploy and the URL is posted as a check; pushes to
# master do a production deploy.
#
# Workflow lives at repo root (.github/workflows/) — GitHub Actions only
# discovers workflows from there. The acgi-ai app is in a subdirectory, so
# defaults.run.working-directory pins all `run:` steps there. Path filters
# are repo-root relative.

name: marketing

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'acgi-ai/infra/**'
      - '.github/workflows/console.yml'
      - 'acgi-ai/DEPLOY.md'
  push:
    branches: [master]
    paths-ignore:
      - 'acgi-ai/infra/**'
      - '.github/workflows/console.yml'
      - 'acgi-ai/DEPLOY.md'

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

defaults:
  run:
    working-directory: acgi-ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No `version:` here — read it from root package.json's
        # `packageManager` field. action-setup@v4 errors on duplicate
        # version declarations now that the monorepo root pins pnpm.

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: acgi-ai/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (sanity check before Vercel takes over)
        run: pnpm build

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: |
          vercel build ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt \
            ${{ github.event_name == 'push' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `marketing preview · ${{ steps.deploy.outputs.url }}`
            })
