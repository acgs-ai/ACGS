# Marketing surface — Vercel deploy (DEPLOY.md §3, §7).
#
# Required secrets:
#   VERCEL_TOKEN          — token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID         — `vercel project ls` reveals it
#   VERCEL_PROJECT_ID     — same
#
# PRs run readiness/lint/build only. Pushes to master do a production deploy
# and fail closed when required Vercel secrets are absent, so a green push run
# cannot imply a skipped production deployment.
#
# Workflow lives at repo root (.github/workflows/) — GitHub Actions only
# discovers workflows from there. The acgi-ai app is in a subdirectory, so
# defaults.run.working-directory pins all `run:` steps there. Path filters
# are repo-root relative.

name: marketing

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'acgi-ai/infra/**'
      - '.github/workflows/console.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'acgi-ai/infra/**'
      - '.github/workflows/console.yml'

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

defaults:
  run:
    working-directory: acgi-ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No `version:` here — read it from root package.json's
        # `packageManager` field. action-setup@v4 errors on duplicate
        # version declarations now that the monorepo root pins pnpm.

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: acgi-ai/pnpm-lock.yaml

      # `--ignore-workspace` keeps acgi-ai installed against its own
      # pnpm-lock.yaml. See console.yml for the full rationale.
      - run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Readiness gate
        run: pnpm test:all

      - name: Lint
        run: pnpm lint

      - name: Build (sanity check before Vercel takes over)
        run: pnpm build:marketing

      # ---- Vercel deploy: master pushes only ----
      # PRs stop after readiness/lint/build. On pushes, missing Vercel
      # credentials are a production-deploy blocker and must fail closed rather
      # than warning and returning green.
      - name: Check Vercel secrets present
        id: vercel_auth
        if: github.event_name == 'push'
        env:
          HAVE_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAVE_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAVE_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          if [ "$HAVE_TOKEN" = "true" ] && [ "$HAVE_ORG" = "true" ] && [ "$HAVE_PROJECT" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Vercel production deploy blocked: set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets. Lint+build above are local readiness only, not production deployment proof."
            exit 1
          fi

      - name: Install Vercel CLI
        if: github.event_name == 'push' && steps.vercel_auth.outputs.available == 'true'
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        if: github.event_name == 'push' && steps.vercel_auth.outputs.available == 'true'
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        if: github.event_name == 'push' && steps.vercel_auth.outputs.available == 'true'
        run: |
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: github.event_name == 'push' && steps.vercel_auth.outputs.available == 'true'
        run: |
          URL=$(vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"
