# Marketing production deployment — Cloudflare Workers Static Assets.
#
# LIVE TOPOLOGY (verified 2026-07-10): acgs.ai and www.acgs.ai are served by
# Worker `acgs-governance-proxy`. Worker routes run before the older shadow
# Pages project, so this workflow deploys infra/cloudflare/workers/wrangler.toml.
# The config pins the four reviewed live routes path-by-path. A 2026-07-11
# incident proved a config deploy without that block detaches the routes and
# takes the apex offline, so neither this workflow nor the config may omit it.
#
# Required production-environment secrets (human-owned):
#   CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit + Account:Read)
#   CLOUDFLARE_ACCOUNT_ID

name: marketing-cloudflare

on:
  push:
    branches: [master]
    paths:
      - 'acgi-ai/**'
      - '!acgi-ai/infra/Caddyfile'
      - '!acgi-ai/infra/Dockerfile.console'
      - '!acgi-ai/infra/cloudrun/**'
      - '.github/workflows/marketing.yml'
      - '.github/workflows/marketing-cloudflare.yml'

concurrency:
  group: marketing-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REVIEWED_PNPM_SELECTOR: 'pnpm@9.15.4+sha512.b2dc20e2fc72b3e18848459b37359a32064663e5627a51e4c74b2c29dd8e8e0491483c3abb40789cfd578bf362fb6ba8261b05f0387d76792ed6e23ea3b1b6a0'

defaults:
  run:
    working-directory: acgi-ai

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Activate integrity-verified pnpm
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = '24.18.0'
          test "$(node -p "require('./package.json').packageManager")" = "$REVIEWED_PNPM_SELECTOR"
          corepack_root="$RUNNER_TEMP/acgs-corepack"
          rm -rf "$corepack_root"
          install -d -m 0700 "$corepack_root/home" "$corepack_root/bin"
          export COREPACK_HOME="$corepack_root/home"
          corepack enable --install-directory "$corepack_root/bin"
          export PATH="$corepack_root/bin:$PATH"
          test "$(corepack pnpm --version)" = '9.15.4'
          test "$(pnpm --version)" = '9.15.4'
          test "$(command -v pnpm)" = "$corepack_root/bin/pnpm"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$corepack_root/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Readiness gate
        run: pnpm test:all

      - name: Build live marketing artifact
        run: pnpm run build:marketing

      - name: Stage and verify Workers Assets configuration
        run: |
          set -euo pipefail
          cp infra/cloudflare/_headers infra/cloudflare/workers/_redirects dist/
          test -f dist/_headers
          test -f dist/_redirects
          ! ls dist/CLAUDE.md dist/DEPLOY.md dist/AGENTS.md dist/DESIGN.md 2>/dev/null

      - name: Verify live Worker routes path by path
        run: |
          set -euo pipefail
          config='infra/cloudflare/workers/wrangler.toml'
          test "$(grep -cF '  { pattern = ' "$config")" -eq 4
          grep -Fqx '  { pattern = "acgs.ai/*", zone_name = "acgs.ai" },' "$config"
          grep -Fqx '  { pattern = "www.acgs.ai/*", zone_name = "acgs.ai" },' "$config"
          grep -Fqx '  { pattern = "console.acgs.ai/*", zone_name = "acgs.ai" },' "$config"
          grep -Fqx '  { pattern = "api.acgs.ai/telegram/*", zone_name = "acgs.ai" },' "$config"

      - name: Upload verified marketing artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-dist
          path: acgi-ai/dist
          if-no-files-found: error

  # Set MARKETING_PRODUCTION_APPROVED_SHA on the production environment to
  # the exact 40-hex commit to authorize. This job has no checkout, token,
  # deployment permission, or secret reference. Missing/stale approval skips
  # the credentialed job without weakening the completed verification result.
  authorize:
    needs: verify
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      approved: ${{ steps.commit_authorization.outputs.approved }}
    steps:
      - name: Authorize exact marketing production commit
        id: commit_authorization
        env:
          APPROVED_SHA: ${{ vars.MARKETING_PRODUCTION_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ && "$APPROVED_SHA" == "$CANDIDATE_SHA" ]]; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'approved=false' >> "$GITHUB_OUTPUT"
          echo '::notice::Marketing production skipped: set production environment variable MARKETING_PRODUCTION_APPROVED_SHA to this exact commit, then rerun.'

  deploy:
    needs: [verify, authorize]
    if: needs.authorize.outputs.approved == 'true'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - name: Download verified marketing artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: marketing-dist
          path: acgi-ai/dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Activate integrity-verified pnpm
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = '24.18.0'
          test "$(node -p "require('./package.json').packageManager")" = "$REVIEWED_PNPM_SELECTOR"
          corepack_root="$RUNNER_TEMP/acgs-corepack"
          rm -rf "$corepack_root"
          install -d -m 0700 "$corepack_root/home" "$corepack_root/bin"
          export COREPACK_HOME="$corepack_root/home"
          corepack enable --install-directory "$corepack_root/bin"
          export PATH="$corepack_root/bin:$PATH"
          test "$(corepack pnpm --version)" = '9.15.4'
          test "$(pnpm --version)" = '9.15.4'
          test "$(command -v pnpm)" = "$corepack_root/bin/pnpm"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$corepack_root/bin" >> "$GITHUB_PATH"

      - name: Install locked deployment dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      # wrangler-action installs its own default when no local executable exists.
      # Prove the reviewed lock produced 4.110.0 before the action runs, and pass
      # the same exact version so no fallback installation is selected.
      - name: Verify locked Wrangler deployment CLI
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = '24.18.0'
          test "$(pnpm --version)" = '9.15.4'
          test -x node_modules/.bin/wrangler
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = '4.110.0'
          test "$(pnpm exec wrangler --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)" = '4.110.0'

      - name: Require Cloudflare production credentials
        id: cf_auth
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAVE_TOKEN" != 'true' || "$HAVE_ACCOUNT" != 'true' ]]; then
            echo '::error::Cloudflare Workers deploy blocked: configure CLOUDFLARE_API_TOKEN (Workers Scripts:Edit) and CLOUDFLARE_ACCOUNT_ID in the production environment.'
            exit 1
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"

      # Deploy only the reviewed Worker script/assets/config. The wrangler file
      # reapplies the four reviewed routes because omitting them detaches them.
      - name: Deploy live Cloudflare Workers Assets origin
        if: steps.cf_auth.outputs.available == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: acgi-ai
          packageManager: pnpm
          wranglerVersion: '4.110.0'
          command: deploy --config infra/cloudflare/workers/wrangler.toml
