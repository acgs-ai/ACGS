# Root governance-invariant test gate.
#
# Closes a real CI hole: the root-level `tests/` guards (monorepo invariants,
# workflow-security invariants, node24 gate, constitutional-hash test, week2
# artifact, hardening report) run in NEITHER `make verify` (which loops
# per-package and then runs `tests/docs` only) NOR any per-package workflow.
# `python-gove-zone.yml` triggers on `tests/**` but executes with
# `working-directory: packages/gove-zone`, so its `pytest tests/` runs the
# package suite — never the root `tests/`. A breaking change to `scripts/`,
# `.github/workflows/`, `.claude/settings.json`, `automation/`, or the
# workspace `pyproject.toml` could therefore merge on a stale-green gate.
#
# Scope (deliberate — see EXCLUSIONS in the run step): this gate runs only the
# environment-independent invariant guards (411 tests on this branch). The
# SaaS-beta evidence proof requires its locked, three-environment bootstrap and
# is gated by the automatic hosted contract lane in
# `saas-beta-p0-evidence.yml`; its exact proof remains authorized/manual. It is
# not a generic root test. The five release-evidence / readiness tests use the dedicated
# `readiness-evidence.yml` workflow (+ its hosted twin); the package-floor /
# mypy-scope tests need initialized submodules and remain a follow-up.

name: tests-root

on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/**'
      - 'tools/kg/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.claude/settings.json'
      - 'automation/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docs/PLAN-MONOREPO.md'
      - 'docs/constitutional-hashes.lock'
  push:
    branches: [master]
    paths:
      - 'tests/**'
      - 'tools/kg/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.claude/settings.json'
      - 'automation/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docs/PLAN-MONOREPO.md'
      - 'docs/constitutional-hashes.lock'

concurrency:
  group: tests-root-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Block fork PRs: untrusted code must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      # Submodules are intentionally NOT initialized: the invariant guards in
      # this gate read parent-tracked files only. The package-floor tests that
      # require submodule pyproject.toml files are excluded below.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: astral-sh/setup-uv@v3

      - name: Run root governance-invariant guards
        # `--no-project` skips the workspace sync (no submodule members to
        # resolve); `--with` supplies the only deps these tests need — pytest,
        # pyyaml (the guards parse workflow/policy YAML), and cryptography.
        # tests/conftest.py puts scripts/ on sys.path so `import
        # hardening_report` etc. resolve.
        #
        # cryptography is REQUIRED, not optional: the key-custody, external-
        # transition, governance-manifest and submodule-integrity guards verify
        # Ed25519 signatures, and they are written to FAIL (not skip) when the
        # backend is absent — an unverifiable signature is a failed verdict, not
        # an untested one. Without it this gate reports 58 failures that say
        # nothing about the code under test.
        #
        # EXCLUSIONS — tests gated elsewhere or deferred:
        #   tests/docs/**                      -> already covered by tests-docs.yml
        #   tests/saas_beta/**                 -> hosted contract; exact proof authorized/manual
        #   test_platform_readiness_report     -> covered by readiness-evidence.yml
        #   test_readiness_evidence_boundaries -> covered by readiness-evidence.yml
        #   test_release_evidence_bundle       -> covered by readiness-evidence.yml
        #   test_production_blocker_evidence   -> covered by readiness-evidence.yml
        #   test_production_launch_preflight   -> covered by readiness-evidence.yml
        #   *_floor_* / *mypy* scope tests     -> need initialized submodules (follow-up)
        run: |
          uv python install 3.11
          uv run --no-project --python 3.11 --with pytest --with pyyaml --with cryptography \
            python -m pytest tests/ \
            --ignore=tests/docs \
            --ignore=tests/saas_beta \
            --ignore=tests/test_platform_readiness_report.py \
            --ignore=tests/test_readiness_evidence_boundaries.py \
            --ignore=tests/test_release_evidence_bundle.py \
            --ignore=tests/test_production_blocker_evidence.py \
            --ignore=tests/test_production_launch_preflight.py \
            -k "not test_acgs_lite_published_floor_unchanged and not test_acgs_swarm_floor_drives_workspace_floor and not test_acgs_swarm_has_strict_core_mypy_gate and not test_typecheck_py_uses_configured_mypy_scope" \
            -v --import-mode=importlib
