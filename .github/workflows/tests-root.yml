# Root governance-invariant test gate.
#
# Closes a real CI hole: the root-level `tests/` guards (monorepo invariants,
# workflow-security invariants, node24 gate, constitutional-hash test, week2
# artifact, hardening report) run in NEITHER `make verify` (which loops
# per-package and then runs `tests/docs` only) NOR any per-package workflow.
# `python-gove-zone.yml` triggers on `tests/**` but executes with
# `working-directory: packages/gove-zone`, so its `pytest tests/` runs the
# package suite — never the root `tests/`. A breaking change to `scripts/`,
# `.github/workflows/`, `.claude/settings.json`, `automation/`, or the
# workspace `pyproject.toml` could therefore merge on a stale-green gate.
#
# Scope (deliberate — see EXCLUSIONS in the run step): this gate runs only the
# environment-independent invariant guards (82 tests, green on master). The
# release-evidence / readiness tests need `make release-evidence` + the
# acgi-ai evidence build to have run first, and the package-floor / mypy-scope
# tests need initialized submodules. Wiring those into CI (and reconciling the
# drifted readiness-evidence packet they assert against) is tracked as a
# follow-up — see the PR that introduced this workflow.

name: tests-root

on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.claude/settings.json'
      - 'automation/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docs/PLAN-MONOREPO.md'
      - 'docs/constitutional-hashes.lock'
  push:
    branches: [master]
    paths:
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.claude/settings.json'
      - 'automation/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docs/PLAN-MONOREPO.md'
      - 'docs/constitutional-hashes.lock'

concurrency:
  group: tests-root-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      # Submodules are intentionally NOT initialized: the invariant guards in
      # this gate read parent-tracked files only. The package-floor tests that
      # require submodule pyproject.toml files are excluded below.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: astral-sh/setup-uv@v3

      - name: Run root governance-invariant guards
        # `--no-project` skips the workspace sync (no submodule members to
        # resolve); `--with` supplies the only deps these tests need — pytest
        # plus pyyaml (the guards parse workflow/policy YAML). tests/conftest.py
        # puts scripts/ on sys.path so `import hardening_report` etc. resolve.
        #
        # EXCLUSIONS — env-dependent tests deferred to a follow-up gate:
        #   tests/docs/**                      -> already covered by tests-docs.yml
        #   test_platform_readiness_report     -> needs `make release-evidence`
        #   test_readiness_evidence_boundaries -> needs release build + evidence reconcile
        #   test_release_evidence_bundle       -> needs `make release-evidence`
        #   test_production_blocker_evidence   -> needs built evidence artifacts
        #   test_production_launch_preflight   -> needs built evidence artifacts
        #   *_floor_* / *mypy* scope tests     -> need initialized submodules
        run: |
          uv python install 3.11
          uv run --no-project --python 3.11 --with pytest --with pyyaml \
            python -m pytest tests/ \
            --ignore=tests/docs \
            --ignore=tests/test_platform_readiness_report.py \
            --ignore=tests/test_readiness_evidence_boundaries.py \
            --ignore=tests/test_release_evidence_bundle.py \
            --ignore=tests/test_production_blocker_evidence.py \
            --ignore=tests/test_production_launch_preflight.py \
            -k "not test_acgs_lite_published_floor_unchanged and not test_acgs_swarm_floor_drives_workspace_floor and not test_acgs_swarm_has_strict_core_mypy_gate and not test_typecheck_py_uses_configured_mypy_scope" \
            -v --import-mode=importlib
