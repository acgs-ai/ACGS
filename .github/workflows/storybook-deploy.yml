# Push-only GitHub Pages publication for the buyer-evidence gallery.
#
# The build job is read-only. Only the deploy job receives Pages and OIDC
# authority, and GitHub's github-pages environment remains the approval/audit
# boundary. This is not proof that the official Storybook runtime is installed.

name: buyer-evidence-storybook-deploy

on:
  push:
    branches: [master]
    paths:
      - 'acgi-ai/package.json'
      - 'acgi-ai/pnpm-lock.yaml'
      - 'acgi-ai/scripts/build-buyer-evidence.mjs'
      - 'acgi-ai/scripts/check-buyer-evidence-artifact.mjs'
      - 'acgi-ai/scripts/check-storybook-runtime-plan.mjs'
      - 'acgi-ai/scripts/check-storybook-publication.mjs'
      - 'acgi-ai/scripts/build-hosted-storybook-handoff.mjs'
      - 'acgi-ai/scripts/check-hosted-storybook-handoff.mjs'
      - 'acgi-ai/scripts/check-hosted-storybook-proof-template.mjs'
      - 'acgi-ai/scripts/build-hosted-storybook-proof-gap-report.mjs'
      - 'acgi-ai/scripts/check-hosted-storybook-proof-gap-report.mjs'
      - 'acgi-ai/storybook-runtime.plan.json'
      - 'acgi-ai/hosted-storybook-proof.example.json'
      - 'acgi-ai/ARCHITECTURE.md'
      - 'acgi-ai/DEPLOY.md'
      - 'acgi-ai/GETTING_STARTED.md'
      - 'README.md'
      - 'docs/integration-readiness-task-map.md'
      - '.github/workflows/storybook.yml'
      - '.github/workflows/storybook-deploy.yml'

concurrency:
  group: buyer-evidence-storybook-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REVIEWED_PNPM_SELECTOR: 'pnpm@9.15.4+sha512.b2dc20e2fc72b3e18848459b37359a32064663e5627a51e4c74b2c29dd8e8e0491483c3abb40789cfd578bf362fb6ba8261b05f0387d76792ed6e23ea3b1b6a0'

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: acgi-ai
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Activate integrity-verified pnpm
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = '24.18.0'
          test "$(node -p "require('./package.json').packageManager")" = "$REVIEWED_PNPM_SELECTOR"
          corepack_root="$RUNNER_TEMP/acgs-corepack"
          rm -rf "$corepack_root"
          install -d -m 0700 "$corepack_root/home" "$corepack_root/bin"
          export COREPACK_HOME="$corepack_root/home"
          corepack enable --install-directory "$corepack_root/bin"
          export PATH="$corepack_root/bin:$PATH"
          test "$(corepack pnpm --version)" = '9.15.4'
          test "$(pnpm --version)" = '9.15.4'
          test "$(command -v pnpm)" = "$corepack_root/bin/pnpm"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$corepack_root/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Verify buyer evidence publication contract
        run: >-
          pnpm test:storybook-runtime-plan &&
          pnpm test:storybook-publication &&
          pnpm test:hosted-storybook-handoff &&
          pnpm test:hosted-storybook-proof-template &&
          pnpm test:hosted-storybook-proof-gap-report

      - name: Build Pages artifact
        env:
          ACGI_EVIDENCE_CNAME: storybook.acgs.ai
        run: pnpm storybook:build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: acgi-ai/dist-buyer-evidence

  # Set STORYBOOK_PRODUCTION_APPROVED_SHA on the github-pages environment to
  # the exact 40-hex commit to authorize. This job checks no repository code
  # and receives neither a token nor Pages/OIDC authority.
  authorize:
    needs: build
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: github-pages
    outputs:
      approved: ${{ steps.commit_authorization.outputs.approved }}
    steps:
      - name: Authorize exact Storybook production commit
        id: commit_authorization
        env:
          APPROVED_SHA: ${{ vars.STORYBOOK_PRODUCTION_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ && "$APPROVED_SHA" == "$CANDIDATE_SHA" ]]; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'approved=false' >> "$GITHUB_OUTPUT"
          echo '::notice::Storybook production skipped: set github-pages environment variable STORYBOOK_PRODUCTION_APPROVED_SHA to this exact commit, then rerun.'

  deploy-pages:
    needs: [build, authorize]
    if: needs.authorize.outputs.approved == 'true'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: https://storybook.acgs.ai
    steps:
      - name: Deploy buyer evidence Storybook to Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
