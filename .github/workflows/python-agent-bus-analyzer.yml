# Path-filtered CI for packages/agent-bus-analyzer/ — observer-only bus analysis.

name: python-agent-bus-analyzer

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/agent-bus-analyzer/**'
      - 'pyproject.toml'
      - '.github/workflows/python-agent-bus-analyzer.yml'
  push:
    branches: [master]
    paths:
      - 'packages/agent-bus-analyzer/**'
      - 'pyproject.toml'
      - '.github/workflows/python-agent-bus-analyzer.yml'

concurrency:
  group: python-agent-bus-analyzer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/agent-bus-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/agent-bus-analyzer/pyproject.toml'

      - name: Install
        run: uv pip install --system --no-config --editable '.[dev]'

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Typecheck
        run: python -m mypy src/

      - name: Test
        run: python -m pytest -q

      - name: OpenAPI export smoke
        run: agent-bus-analyzer export-openapi --output -

      - name: OpenAPI drift check
        working-directory: ${{ github.workspace }}
        run: |
          make openapi
          git diff --exit-code -- acgi-ai/src/api/openapi.json
