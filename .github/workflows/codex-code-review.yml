name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]
  # Re-run after a late connector review so a timed-out required check can
  # turn green without a new push. This event is read from the default-branch
  # workflow after merge; until then, re-run the job by hand.
  pull_request_review:
    types: [submitted]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# `codex-review` is a REQUIRED status check on master. It must therefore always run and
# always report a real conclusion.
#
# GitHub satisfies a required check on `success`, `skipped`, OR `neutral`, and documents that
# "a job that is skipped will report its status as 'Success'. It will not prevent a pull
# request from merging, even if it is a required check." A job-level `if:` on a required job
# is therefore a silent bypass of that gate, not a way to opt out of it.
#
# This workflow previously carried two such bypasses:
#   1. a job-level `if:` on author_association, so any pull request from outside the
#      OWNER/MEMBER/COLLABORATOR set skipped the job and satisfied the gate with no review;
#   2. an empty OPENAI_API_KEY, which skipped every reviewing step and left the job green —
#      this one fired for collaborators too, e.g. if the secret were rotated out or unset.
#
# The gate now fails closed instead. When the review genuinely cannot run, a maintainer must
# make that call explicitly by applying the `codex-review-waived` label, which leaves an
# auditable record on the pull request.
#
# Review auth is the ChatGPT Codex GitHub connector (subscription seat), not platform
# API credits. `openai/codex-action` always bills an API key through the Responses API
# proxy, and stuffing `~/.codex/auth.json` into Actions is not allowed on a public
# repository. The connector already posts as `chatgpt-codex-connector[bot]`; this job
# only waits for a SHA-bound review from that bot on the pull request head. Issue-level
# 👍 reactions are not evidence: they are not bound to a commit.
#
# The gate can only decide what it is allowed to reach. Every step that can fail for
# infrastructure reasons therefore carries `continue-on-error: true` and an `id:`, and the
# gate reads the review-path outcomes explicitly. `continue-on-error` here does not soften
# the gate: a missing connector review with no waiver still exits non-zero below.
jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      IS_WAIVED: ${{ contains(github.event.pull_request.labels.*.name, 'codex-review-waived') }}
    steps:
      # `continue-on-error` keeps a timeout from turning the job red on its own: the
      # "Gate on review outcome" step below is the sole decider of this required check.
      - name: Wait for ChatGPT Codex subscription review
        if: ${{ env.IS_WAIVED != 'true' }}
        id: codex-review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONNECTOR_BOT: "chatgpt-codex-connector[bot]"
          WAIT_SECONDS: "900"
        run: |
          set -euo pipefail

          count_reviews() {
            gh api --paginate --slurp "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
              | jq --arg sha "$HEAD_SHA" --arg bot "$CONNECTOR_BOT" \
                '[((add // []) | .[]) | select(.user.login == $bot and .commit_id == $sha)] | length'
          }

          deadline=$((SECONDS + WAIT_SECONDS))
          while true; do
            reviews=$(count_reviews)
            if [ "$reviews" -gt 0 ]; then
              echo "ChatGPT Codex connector review found for ${HEAD_SHA} (reviews=${reviews})."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=ChatGPT Codex review missing::No ${CONNECTOR_BOT} review bound to ${HEAD_SHA} after ${WAIT_SECONDS}s."
              echo "Comment '@codex review', then re-run this job after the review lands (or wait for the pull_request_review trigger once this workflow is on the default branch)."
              exit 1
            fi
            echo "Waiting for ${CONNECTOR_BOT} review of ${HEAD_SHA} (reviews=0)..."
            sleep 20
          done

      # Decides the required check. Runs unconditionally so the gate can never be satisfied
      # by a skip; the only green paths are "the ChatGPT connector reviewed this head SHA"
      # and "a maintainer waived it". This is a liveness gate: it does not parse the review
      # text as an APPROVE/REJECT verdict.
      - name: Gate on review outcome
        if: ${{ always() }}
        env:
          REVIEW_OUTCOME: ${{ steps.codex-review.outcome }}
        run: |
          set -euo pipefail

          if [ "$REVIEW_OUTCOME" = "success" ]; then
            echo "ChatGPT Codex connector review is present for this head SHA."
            exit 0
          fi

          if [ "$IS_WAIVED" = "true" ]; then
            echo "::warning title=Codex review waived::A maintainer applied the 'codex-review-waived' label, so this required check passes without a Codex review. The waiver is recorded in the pull request's label history."
            exit 0
          fi

          if [ "$REVIEW_OUTCOME" = "skipped" ]; then
            reason="the wait step was skipped without a waiver"
          else
            reason="no chatgpt-codex-connector[bot] review bound to this head SHA (outcome: '$REVIEW_OUTCOME')"
          fi

          echo "::error title=Codex review did not run::This required check fails closed because $reason."
          echo "Reason: $reason."
          echo
          echo "Comment '@codex review' and re-run this check after the SHA-bound review lands,"
          echo "or apply the 'codex-review-waived' label after a maintainer reviews the change by hand."
          exit 1
