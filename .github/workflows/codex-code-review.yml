name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]

# `codex-review` is a REQUIRED status check on master. It must therefore always run and
# always report a real conclusion.
#
# GitHub satisfies a required check on `success`, `skipped`, OR `neutral`, and documents that
# "a job that is skipped will report its status as 'Success'. It will not prevent a pull
# request from merging, even if it is a required check." A job-level `if:` on a required job
# is therefore a silent bypass of that gate, not a way to opt out of it.
#
# This workflow previously carried two such bypasses:
#   1. a job-level `if:` on author_association, so any pull request from outside the
#      OWNER/MEMBER/COLLABORATOR set skipped the job and satisfied the gate with no review;
#   2. an empty OPENAI_API_KEY, which skipped every reviewing step and left the job green —
#      this one fired for collaborators too, e.g. if the secret were rotated out or unset.
#
# The gate now fails closed instead. When the review genuinely cannot run (fork pull requests
# do not receive secrets), a maintainer must make that call explicitly by applying the
# `codex-review-waived` label, which leaves an auditable record on the pull request.
jobs:
  codex-review:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Fork pull requests do not receive repository secrets, so the review cannot run for
      # them regardless of author_association. Both conditions are evaluated explicitly
      # below rather than skipping the job.
      IS_INTERNAL: ${{ github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'COLLABORATOR' }}
      IS_WAIVED: ${{ contains(github.event.pull_request.labels.*.name, 'codex-review-waived') }}
    steps:
      - name: Checkout repository
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          fetch-depth: 1

      - name: Pre-fetch base and head refs
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' }}
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      # openai/codex-action's default `drop-sudo` safety strategy revokes sudo by
      # removing the runner user from the `sudo` group and stripping `<user> ...`
      # lines from the sudoers files, then verifies that `sudo -n true` fails. On
      # Blacksmith runners passwordless sudo comes from a group rule
      # (`%sudo ... NOPASSWD`), which survives both: the already-running job keeps
      # the `sudo` gid in its process group vector even after `deluser`, so the
      # action's verification fails and this required gate goes red on every run.
      # Move the grant to a user-level rule (which drop-sudo does strip) and
      # comment out every group-based rule, so drop-sudo can fully revoke sudo.
      # If sudo were granted through yet another mechanism, the action would keep
      # failing closed exactly as before, so this step cannot weaken the gate.
      - name: Make sudo revocable for the drop-sudo safety strategy
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' }}
        run: |
          set -euo pipefail
          echo "$(id -un) ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee /etc/sudoers.d/zz-drop-sudo-shim >/dev/null
          sudo chmod 0440 /etc/sudoers.d/zz-drop-sudo-shim
          sudo find /etc/sudoers.d -maxdepth 1 -type f ! -name zz-drop-sudo-shim \
            -exec sed -i -E 's/^[[:space:]]*%/#&/' '{}' +
          sudo sed -i -E 's/^[[:space:]]*%/#&/' /etc/sudoers
          sudo visudo -c
          sudo -K
          sudo -n true

      # `continue-on-error` keeps a review-step failure from failing the job directly,
      # so the "Gate on review outcome" step below is the single decider of this
      # required check. This does not weaken the gate: the gate reads the step's raw
      # `outcome` (which stays 'failure' under continue-on-error) and still exits 1
      # for any non-success outcome unless a maintainer applied the auditable
      # `codex-review-waived` label. Without this, a waived PR stayed red because the
      # failed review step marked the job failed even after the gate step passed.
      - name: Run Codex Code Review
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' }}
        id: codex-review
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-review-output.md
          sandbox: read-only

      - name: Post Codex feedback
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' && steps.codex-review.outputs.final-message != '' }}
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex-review.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });

      # Decides the required check. Runs unconditionally so the gate can never be satisfied
      # by a skip; the only green paths are "the review ran" and "a maintainer waived it".
      - name: Gate on review outcome
        if: ${{ always() }}
        env:
          REVIEW_OUTCOME: ${{ steps.codex-review.outcome }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail

          if [ "$REVIEW_OUTCOME" = "success" ]; then
            echo "Codex review ran and completed."
            exit 0
          fi

          if [ "$IS_WAIVED" = "true" ]; then
            echo "::warning title=Codex review waived::A maintainer applied the 'codex-review-waived' label, so this required check passes without a Codex review. The waiver is recorded in the pull request's label history."
            exit 0
          fi

          if [ "$IS_INTERNAL" != "true" ]; then
            reason="the author's association is '$AUTHOR_ASSOCIATION', and fork pull requests do not receive repository secrets, so the review cannot run"
          elif [ -z "$OPENAI_API_KEY" ]; then
            reason="the OPENAI_API_KEY secret is not configured or is empty"
          else
            reason="the review step did not complete (outcome: '$REVIEW_OUTCOME')"
          fi

          echo "::error title=Codex review did not run::This required check fails closed because $reason."
          echo "Reason: $reason."
          echo
          echo "A maintainer must review these changes by hand, then apply the"
          echo "'codex-review-waived' label to record that decision and unblock the merge."
          exit 1
