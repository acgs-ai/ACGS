name: Codex Code Review

on:
  # Both events load this workflow from the default branch. The job reads PR
  # metadata and connector comments only; it never executes pull-request code.
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

# This workflow publishes the explicit commit-status context `codex-review` on
# the current PR head. A green status requires a completed connector summary
# whose trusted metadata embeds that complete 40-character head SHA and whose
# table says the code review completed. There is no label or actor waiver.
#
# Connector comment create/edit/delete events re-evaluate the status. The event
# payload supplies the previously accepted SHA before any API request, allowing
# the workflow to mark that SHA pending before fallible metadata lookups.
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      CONNECTOR_BOT: chatgpt-codex-connector[bot]
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve affected head from trusted event payload
        id: event
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            pr_number=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            head_sha=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          else
            pr_number=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
            is_pr=$(jq -r '.issue.pull_request.url // empty' "$GITHUB_EVENT_PATH")
            comment_author=$(jq -r '.comment.user.login // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$is_pr" ] || [ "$comment_author" != "$CONNECTOR_BOT" ]; then
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # On edit, changes.body.from preserves the formerly accepted SHA;
            # on create/delete, comment.body carries the relevant body.
            head_sha=$(jq -r '
              [(.comment.body // ""), (.changes.body.from // "")]
              | map(try capture("\\\"headSha\\\"\\s*:\\s*\\\"(?<sha>[0-9a-fA-F]{40})\\\"").sha catch empty)
              | first // empty
            ' "$GITHUB_EVENT_PATH")
            if [ -z "$head_sha" ]; then
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! [[ "$head_sha" =~ ^[0-9a-fA-F]{40}$ && "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error title=Malformed event metadata::Head SHA or PR number is malformed."
            exit 1
          fi

          {
            echo "is_pr=true"
            echo "pr_number=$pr_number"
            echo "head_sha=${head_sha,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Mark affected head pending
        if: ${{ steps.event.outputs.is_pr == 'true' }}
        env:
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context=codex-review \
            -f description="Revalidating exact-head Codex review evidence" \
            -f target_url="$RUN_URL"

      - name: Confirm the affected SHA is the current PR head
        if: ${{ steps.event.outputs.is_pr == 'true' }}
        id: current
        env:
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          PR_NUMBER: ${{ steps.event.outputs.pr_number }}
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [ "$current_head" = "$HEAD_SHA" ]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted evidence counter
        if: ${{ steps.event.outputs.is_pr == 'true' && steps.current.outputs.is_current == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Evaluate exact-head connector evidence
        if: ${{ steps.event.outputs.is_pr == 'true' && steps.current.outputs.is_current == 'true' }}
        id: evidence
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          PR_NUMBER: ${{ steps.event.outputs.pr_number }}
          WAIT_SECONDS: ${{ github.event_name == 'pull_request_target' && '900' || '0' }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + WAIT_SECONDS))
          while true; do
            comments=$(gh api --paginate --slurp "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" \
              | python3 scripts/count_codex_connector_evidence.py --sha "$HEAD_SHA" --bot "$CONNECTOR_BOT")
            if [ "$comments" -gt 0 ]; then
              echo "Completed exact-head connector evidence found for ${HEAD_SHA}."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Codex review missing::No completed ${CONNECTOR_BOT} summary is bound to ${HEAD_SHA}."
              exit 1
            fi
            echo "Waiting for completed ${CONNECTOR_BOT} evidence of ${HEAD_SHA}..."
            sleep 20
          done

      - name: Publish Codex review status
        if: ${{ always() && steps.event.outputs.is_pr == 'true' }}
        env:
          HEAD_SHA: ${{ steps.event.outputs.head_sha }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail

          if [ "$EVIDENCE_OUTCOME" = "success" ]; then
            state=success
            description="Completed exact-head Codex review is present"
          else
            state=failure
            description="Completed exact-head Codex review is missing"
          fi

          gh api --method POST "repos/${GH_REPO}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context=codex-review \
            -f description="$description" \
            -f target_url="$RUN_URL"

          [ "$state" = "success" ]
