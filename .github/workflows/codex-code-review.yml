name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  codex-review:
    if: github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Note missing OpenAI API key
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "::notice title=Codex review skipped::OPENAI_API_KEY secret is not configured."

      - name: Checkout repository
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          fetch-depth: 1

      - name: Pre-fetch base and head refs
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex Code Review
        if: ${{ env.OPENAI_API_KEY != '' }}
        id: codex-review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-review-output.md
          # The default drop-sudo safety strategy fails on Blacksmith runners:
          # the running job keeps its sudo group membership after deluser, so
          # the action's "Verify sudo privilege removed" check always fails.
          # read-only forces the same legacy read-only sandbox without the
          # sudo-drop step.
          safety-strategy: read-only

      - name: Post Codex feedback
        if: ${{ env.OPENAI_API_KEY != '' && steps.codex-review.outputs.final-message != '' }}
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex-review.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
