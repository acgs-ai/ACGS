name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled, unlabeled]

# `codex-review` is a REQUIRED status check on master. It must therefore always run and
# always report a real conclusion.
#
# GitHub satisfies a required check on `success`, `skipped`, OR `neutral`, and documents that
# "a job that is skipped will report its status as 'Success'. It will not prevent a pull
# request from merging, even if it is a required check." A job-level `if:` on a required job
# is therefore a silent bypass of that gate, not a way to opt out of it.
#
# This workflow previously carried two such bypasses:
#   1. a job-level `if:` on author_association, so any pull request from outside the
#      OWNER/MEMBER/COLLABORATOR set skipped the job and satisfied the gate with no review;
#   2. an empty OPENAI_API_KEY, which skipped every reviewing step and left the job green —
#      this one fired for collaborators too, e.g. if the secret were rotated out or unset.
#
# The gate now fails closed instead. When the review genuinely cannot run (fork pull requests
# do not receive secrets), a maintainer must make that call explicitly by applying the
# `codex-review-waived` label, which leaves an auditable record on the pull request.
#
# The gate can only decide what it is allowed to reach. Every step that can fail for
# infrastructure reasons therefore carries `continue-on-error: true` and an `id:`, and the
# gate reads the review-path outcomes explicitly. Without that, a step failing *before* or
# *after* the gate's logical decision can mark the job failed on its own, which made the
# waiver unreachable exactly when it was needed. `continue-on-error` here does not soften
# the gate: an infrastructure failure with no waiver still exits non-zero below.
jobs:
  codex-review:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Fork pull requests do not receive repository secrets, so the review cannot run for
      # them regardless of author_association. Both conditions are evaluated explicitly
      # below rather than skipping the job.
      IS_INTERNAL: ${{ github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'COLLABORATOR' }}
      IS_WAIVED: ${{ contains(github.event.pull_request.labels.*.name, 'codex-review-waived') }}
    steps:
      # `persist-credentials: false` is deliberate and load-bearing: the Codex step below runs
      # a model over this working tree, and a persisted token in `.git/config` would be inside
      # what it can read. Nothing after this step may assume git can authenticate.
      #
      # `fetch-depth: 2` gets the merge commit AND both of its parents, which is all the
      # materialization below needs. Depth 1 would fetch the merge commit alone.
      - name: Checkout repository
        id: checkout
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          fetch-depth: 2

      # Materializes the same two ref names the previous `git fetch` produced, from commits
      # that are already local — so it needs no network and no credentials.
      #
      # This step used to run `git fetch --no-tags origin ...`. With `persist-credentials:
      # false` that fetch is unauthenticated, which silently worked while this repository was
      # public and began failing the moment it went private:
      #
      #     fatal: could not read Username for 'https://github.com': No such device or address
      #
      # A merge ref's first parent IS the base commit and its second parent IS the head
      # commit, so both refs can be derived locally. Re-authenticating instead would mean
      # putting a token back within reach of the model — see the checkout note above.
      - name: Materialize base and head refs
        id: refs
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # A merge ref always has two parents. If it does not, the checkout is not what we
          # think it is — fail loudly rather than review the wrong tree.
          if ! base_sha=$(git rev-parse --verify --quiet 'HEAD^1'); then
            echo "::error title=Unexpected checkout::HEAD has no first parent; expected a merge ref."
            exit 1
          fi
          if ! head_sha=$(git rev-parse --verify --quiet 'HEAD^2'); then
            echo "::error title=Unexpected checkout::HEAD has no second parent; expected a merge ref."
            exit 1
          fi

          git update-ref "refs/remotes/origin/$PR_BASE_REF" "$base_sha"
          git update-ref "refs/pull/$PR_NUMBER/head" "$head_sha"

          echo "base: $PR_BASE_REF -> $base_sha"
          echo "head: refs/pull/$PR_NUMBER/head -> $head_sha"

      # `continue-on-error` keeps a failed review step from turning the job red on its
      # own: the "Gate on review outcome" step below is the sole decider of this required
      # check (it reads `steps.codex-review.outcome`, which records the real result even
      # with `continue-on-error`), so an unwaived failure still fails the gate.
      - name: Run Codex Code Review
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' && steps.checkout.outcome == 'success' && steps.refs.outcome == 'success' }}
        id: codex-review
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-review-output.md
          # `read-only` forces the legacy read-only sandbox (equivalent to
          # `sandbox: read-only`) without the default `drop-sudo` strategy, whose
          # "verify sudo removed" assertion fails deterministically on Blacksmith
          # runners because sudo is not granted via the mechanisms it strips.
          safety-strategy: read-only

      # Posting feedback is best-effort. A GitHub API/rate-limit/body-size failure must not
      # override the gate's decision after Codex has completed; the gate below remains the
      # sole decider of the required check.
      - name: Post Codex feedback
        id: post-feedback
        continue-on-error: true
        if: ${{ env.OPENAI_API_KEY != '' && env.IS_INTERNAL == 'true' && steps.codex-review.outputs.final-message != '' }}
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex-review.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });

      # Decides the required check. Runs unconditionally so the gate can never be satisfied
      # by a skip; the only green paths are "the Codex action completed" and "a maintainer
      # waived it". This is a liveness gate: it does not parse the review text as an
      # APPROVE/REJECT verdict.
      - name: Gate on review outcome
        if: ${{ always() }}
        env:
          REVIEW_OUTCOME: ${{ steps.codex-review.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          REFS_OUTCOME: ${{ steps.refs.outcome }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail

          # Successful action execution is the only unconditional pass. This means Codex ran
          # to completion after checkout and ref materialization succeeded; it does NOT mean
          # that the review text approved the change.
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            echo "Codex review action ran and completed."
            exit 0
          fi

          # Everything below this line is a non-result: infrastructure failure or an
          # environment where the review cannot run. All of them fail closed unless a
          # maintainer has explicitly waived.
          if [ "$IS_WAIVED" = "true" ]; then
            echo "::warning title=Codex review waived::A maintainer applied the 'codex-review-waived' label, so this required check passes without a Codex review. The waiver is recorded in the pull request's label history."
            exit 0
          fi

          if [ "$IS_INTERNAL" != "true" ]; then
            reason="the author's association is '$AUTHOR_ASSOCIATION', and fork pull requests do not receive repository secrets, so the review cannot run"
          elif [ -z "$OPENAI_API_KEY" ]; then
            reason="the OPENAI_API_KEY secret is not configured or is empty"
          elif [ "$CHECKOUT_OUTCOME" != "success" ]; then
            reason="the repository checkout did not succeed (outcome: '$CHECKOUT_OUTCOME'); the pull request may not have a mergeable merge ref"
          elif [ "$REFS_OUTCOME" != "success" ]; then
            reason="the base and head refs could not be materialized (outcome: '$REFS_OUTCOME'), so there was no diff for Codex to review"
          else
            reason="the review step did not complete (outcome: '$REVIEW_OUTCOME')"
          fi

          echo "::error title=Codex review did not run::This required check fails closed because $reason."
          echo "Reason: $reason."
          echo
          echo "A maintainer must review these changes by hand, then apply the"
          echo "'codex-review-waived' label to record that decision and unblock the merge."
          exit 1
