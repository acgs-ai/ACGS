# Path-filtered CI for packages/acgs-control-plane/ — enterprise governance control plane.

name: python-acgs-control-plane

on:
  pull_request:
    branches:
      - master
      - 'beta/**'
    paths:
      # acgs-control-plane is a private submodule: parent-side changes are
      # gitlink bumps (bare path) or .gitmodules edits, not in-tree files.
      - 'packages/acgs-control-plane'
      - '.gitmodules'
      - 'packages/gove-zone/**'
      - 'requirements/saas-beta/cp-test.in'
      - 'requirements/saas-beta/cp-test.lock'
      - 'pyproject.toml'
      - '.github/workflows/python-acgs-control-plane.yml'
  push:
    branches: [master]
    paths:
      - 'packages/acgs-control-plane'
      - '.gitmodules'
      - 'packages/gove-zone/**'
      - 'requirements/saas-beta/cp-test.in'
      - 'requirements/saas-beta/cp-test.lock'
      - 'pyproject.toml'
      - '.github/workflows/python-acgs-control-plane.yml'

concurrency:
  group: python-acgs-control-plane-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/acgs-control-plane

jobs:
  test:
    # Block fork PRs: untrusted code must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: false

      # acgs-control-plane is a private submodule; this whole lane tests it,
      # so a missing/underscoped SUBMODULE_TOKEN must fail loudly, not skip.
      - name: Init control-plane submodule (hard requirement)
        working-directory: ${{ github.workspace }}
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          # Ephemeral global gitconfig: self-hosted runner runs as the
          # operator's user; keep the token out of the real ~/.gitconfig
          # (see python-clinicalguard.yml for rationale).
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/submodule-gitconfig"
          if [ -z "${SUBMODULE_TOKEN}" ]; then
            echo "::error::SUBMODULE_TOKEN is required: acgs-control-plane is a private submodule and this lane runs its tests." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync -- packages/acgs-control-plane
          git submodule update --init --recursive -- packages/acgs-control-plane

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: 0.11.19
          enable-cache: true
          cache-dependency-glob: 'packages/acgs-control-plane/pyproject.toml'

      - name: Install
        # Mirrors python-agent-bus-analyzer.yml: uv-provisioned interpreter +
        # explicit venv. gove-zone is a workspace member, so install it from
        # the sibling path first (uv sources don't apply to `uv pip`).
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }} --clear .venv
          uv pip install --python .venv/bin/python --editable ../gove-zone
          uv pip install --python .venv/bin/python --editable . --group dev

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Typecheck
        run: .venv/bin/mypy src/

      - name: Test
        run: .venv/bin/pytest -q

  postgresql-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: 'postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394'
        env:
          POSTGRES_DB: acgs_control_plane_test
          POSTGRES_USER: acgs_control_plane_test
          POSTGRES_PASSWORD: g101-test-password-17
        ports:
          # Fixed, not dynamic: the max_connections step below restarts this
          # container, and Docker reallocates a dynamically published port on
          # restart while ${{ job.services.postgres.ports['5432'] }} keeps
          # resolving to the port captured at service start.
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acgs_control_plane_test -d acgs_control_plane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      # acgs-control-plane is a private submodule; the migration suites live
      # inside it, so token failures must be loud (see the test job above).
      - name: Init control-plane submodule (hard requirement)
        working-directory: ${{ github.workspace }}
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/submodule-gitconfig"
          if [ -z "${SUBMODULE_TOKEN}" ]; then
            echo "::error::SUBMODULE_TOKEN is required: acgs-control-plane is a private submodule and this lane runs its migration suites." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync -- packages/acgs-control-plane
          git submodule update --init --recursive -- packages/acgs-control-plane

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: 0.11.19
          enable-cache: true
          cache-dependency-glob: 'requirements/saas-beta/cp-test.lock'

      - name: Install locked migration test environment
        run: |
          uv python install 3.11.14
          uv venv --python 3.11.14 --clear .venv
          uv pip sync \
            --python .venv/bin/python \
            --require-hashes \
            ../../requirements/saas-beta/cp-test.lock
          uv pip install \
            --python .venv/bin/python \
            --no-deps \
            --no-build-isolation \
            --editable ../gove-zone \
            --editable .

      - name: Provision digest-pinned PostgreSQL 17.10 client wrappers
        shell: bash
        run: |
          set -euo pipefail
          client_image='postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394'
          client_dir="$RUNNER_TEMP/postgresql-client-17.10"
          mkdir -p "$client_dir"
          docker pull "$client_image"
          docker image inspect --format '{{json .RepoDigests}}' "$client_image" \
            | grep --fixed-strings 'sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394'
          cat >"$client_dir/postgresql-client" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          image='postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394'
          tool="$(basename "$0")"
          case "$tool" in
            psql|pg_dump|pg_restore) ;;
            *) echo 'unsupported PostgreSQL client wrapper' >&2; exit 64 ;;
          esac

          declare -A mount_directories=()
          add_path_parent() {
            local candidate="$1"
            local directory
            if [[ -d "$candidate" ]]; then
              directory="$(realpath "$candidate")"
            else
              directory="$(realpath -m "$(dirname "$candidate")")"
            fi
            mount_directories["$directory"]=1
          }

          for variable in PGPASSFILE PGSSLROOTCERT PGSSLCERT PGSSLKEY; do
            if [[ -n "${!variable:-}" ]]; then
              add_path_parent "${!variable}"
            fi
          done
          for argument in "$@"; do
            case "$argument" in
              --file=*) add_path_parent "${argument#--file=}" ;;
              /*) add_path_parent "$argument" ;;
            esac
          done

          docker_arguments=(
            run --rm --network host
          )
          if ! docker info --format '{{json .SecurityOptions}}' | grep --quiet rootless; then
            docker_arguments+=(--user "$(id -u):$(id -g)")
          fi
          for variable in \
            PGHOST PGPORT PGUSER PGPASSWORD PGDATABASE PGPASSFILE \
            PGCONNECT_TIMEOUT PGOPTIONS PGSSLMODE PGSSLROOTCERT PGSSLCERT PGSSLKEY \
            PGAPPNAME LANG LC_ALL LC_CTYPE
          do
            if [[ -v "$variable" ]]; then
              docker_arguments+=(--env "$variable")
            fi
          done
          for directory in "${!mount_directories[@]}"; do
            docker_arguments+=(
              --volume "$directory:$directory:rw,Z"
            )
          done
          exec docker "${docker_arguments[@]}" "$image" "$tool" "$@"
          BASH
          chmod 0755 "$client_dir/postgresql-client"
          ln -s postgresql-client "$client_dir/psql"
          ln -s postgresql-client "$client_dir/pg_dump"
          ln -s postgresql-client "$client_dir/pg_restore"
          echo "$client_dir" >> "$GITHUB_PATH"
          export PATH="$client_dir:$PATH"
          test "$(psql --version | awk '{print $3}')" = '17.10'
          test "$(pg_dump --version | awk '{print $3}')" = '17.10'
          test "$(pg_restore --version | awk '{print $3}')" = '17.10'

      # The tenant-bootstrap vertical spawns 100 client processes that each hold a
      # PostgreSQL connection while racing the single-winner bootstrap, on top of the
      # parent fixture's pooled connections. The image default max_connections=100 is
      # below that concurrent demand, so raise it before any suite connects.
      # GitHub Actions service containers cannot override the container command, so
      # apply the setting via ALTER SYSTEM and restart the server to load it.
      - name: Raise PostgreSQL max_connections for the multiprocess vertical
        shell: bash
        run: |
          set -euo pipefail
          container_id='${{ job.services.postgres.id }}'
          host_port='${{ job.services.postgres.ports['5432'] }}'
          docker exec "$container_id" psql \
            --username acgs_control_plane_test \
            --dbname acgs_control_plane_test \
            --set ON_ERROR_STOP=1 \
            --command 'ALTER SYSTEM SET max_connections = 400'
          # Restart the container, not the server process: postgres is PID 1 here,
          # so `pg_ctl restart` stops the container out from under `docker exec`
          # (SIGKILL, exit 137). The published port is pinned above, so the
          # host-side mapping survives this restart.
          docker restart "$container_id" >/dev/null
          for _ in {1..60}; do
            if docker exec "$container_id" pg_isready \
              --username acgs_control_plane_test \
              --dbname acgs_control_plane_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          # In-container readiness does not prove the published port still works.
          # Probe the exact endpoint later steps use, with the pinned client.
          for _ in {1..60}; do
            if PGHOST=127.0.0.1 PGPORT="$host_port" \
              PGUSER=acgs_control_plane_test PGPASSWORD=g101-test-password-17 \
              PGDATABASE=acgs_control_plane_test \
              psql --set ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          PGHOST=127.0.0.1 PGPORT="$host_port" \
            PGUSER=acgs_control_plane_test PGPASSWORD=g101-test-password-17 \
            PGDATABASE=acgs_control_plane_test \
            psql --set ON_ERROR_STOP=1 --command 'SELECT 1' >/dev/null
          docker exec "$container_id" psql \
            --username acgs_control_plane_test \
            --dbname acgs_control_plane_test \
            --set ON_ERROR_STOP=1 \
            --tuples-only --no-align \
            --command 'SHOW max_connections' | grep -qx '400'

      - name: Create fixed disposable databases
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: acgs_control_plane_test
          PGPASSWORD: g101-test-password-17
          PGDATABASE: acgs_control_plane_test
        run: |
          set -euo pipefail
          for database in \
            acgs_control_plane_recovery_source_test \
            acgs_control_plane_recovery_target_test \
            acgs_control_plane_recovery_bytea_test \
            acgs_control_plane_rolling_upgrade_test
          do
            psql --set ON_ERROR_STOP=1 --command "CREATE DATABASE ${database}"
          done

      - name: Build immutable pre-G101 candidate twice
        id: old-candidate
        shell: bash
        run: |
          set -euo pipefail
          old_commit='4f0c685b5d2ffac0e6a71810b77c6357b8d56a94'
          pinned_digest='40ff7b40f27a2b698d3b607c710f1866f11850a9a2c42a7c0eb51a6fe8be3d93'
          git -C "$GITHUB_WORKSPACE" cat-file -e "${old_commit}^{commit}"
          mkdir -p "$RUNNER_TEMP/acp-old" "$RUNNER_TEMP/old-1" "$RUNNER_TEMP/old-2"
          git -C "$GITHUB_WORKSPACE" archive "$old_commit" \
            | tar -x -C "$RUNNER_TEMP/acp-old"
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$old_commit")"
          uv build --no-build-isolation \
            --python "$GITHUB_WORKSPACE/packages/acgs-control-plane/.venv/bin/python" \
            --offline --no-index --no-cache --wheel --out-dir "$RUNNER_TEMP/old-1" \
            "$RUNNER_TEMP/acp-old/packages/acgs-control-plane"
          uv build --no-build-isolation \
            --python "$GITHUB_WORKSPACE/packages/acgs-control-plane/.venv/bin/python" \
            --offline --no-index --no-cache --wheel --out-dir "$RUNNER_TEMP/old-2" \
            "$RUNNER_TEMP/acp-old/packages/acgs-control-plane"
          old_wheel="$RUNNER_TEMP/old-1/acgs_control_plane-0.1.0-py3-none-any.whl"
          second_wheel="$RUNNER_TEMP/old-2/acgs_control_plane-0.1.0-py3-none-any.whl"
          test -f "$old_wheel"
          test -f "$second_wheel"
          cmp "$old_wheel" "$second_wheel"
          test "$(sha256sum "$old_wheel" | awk '{print $1}')" = "$pinned_digest"
          test "$(sha256sum "$second_wheel" | awk '{print $1}')" = "$pinned_digest"
          printf 'wheel=%s\n' "$old_wheel" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$pinned_digest" >> "$GITHUB_OUTPUT"

      - name: Test PostgreSQL migration, coordination, CLI, and startup suites
        shell: bash
        env:
          ACP_TEST_POSTGRES_ALLOW_DESTRUCTIVE: '1'
          ACP_TEST_POSTGRES_URL: postgresql+psycopg://acgs_control_plane_test:g101-test-password-17@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/acgs_control_plane_test
        run: |
          UV_BIN="$(command -v uv)" .venv/bin/pytest -q \
            tests/test_postgresql_migrations.py \
            tests/test_postgresql_migration_cli.py \
            tests/test_startup_preflight.py \
            tests/test_postgresql_receipt_cursor_pagination.py

      - name: Test PostgreSQL migration recovery
        shell: bash
        env:
          ACP_TEST_POSTGRES_ALLOW_DESTRUCTIVE: '1'
          ACP_TEST_RECOVERY_SOURCE_URL: postgresql+psycopg://acgs_control_plane_test:g101-test-password-17@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/acgs_control_plane_recovery_source_test
          ACP_TEST_RECOVERY_TARGET_URL: postgresql+psycopg://acgs_control_plane_test:g101-test-password-17@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/acgs_control_plane_recovery_target_test
        run: .venv/bin/pytest -q tests/test_postgresql_migration_recovery.py

      - name: Test PostgreSQL bytea recovery preflight
        shell: bash
        env:
          ACP_TEST_POSTGRES_ALLOW_DESTRUCTIVE: '1'
          ACP_TEST_RECOVERY_BYTEA_URL: postgresql+psycopg://acgs_control_plane_test:g101-test-password-17@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/acgs_control_plane_recovery_bytea_test
        run: .venv/bin/pytest -q tests/test_postgresql_migration_recovery_bytea.py

      - name: Test PostgreSQL candidate rolling upgrade
        shell: bash
        env:
          ACP_TEST_POSTGRES_ALLOW_DESTRUCTIVE: '1'
          ACP_TEST_POSTGRES_URL: postgresql+psycopg://acgs_control_plane_test:g101-test-password-17@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/acgs_control_plane_rolling_upgrade_test
          ACP_TEST_OLD_APP_ARTIFACT: ${{ steps.old-candidate.outputs.wheel }}
          ACP_TEST_OLD_APP_ARTIFACT_SHA256: ${{ steps.old-candidate.outputs.digest }}
        run: .venv/bin/pytest -q tests/test_postgresql_rolling_upgrade.py

      # Dispatcher-level proof that POST /v1/tenant-bootstrap enforces scoped receipt-v2
      # trust and fails closed with zero side effects. Runs last: the fixture resets the
      # main disposable schema on setup and teardown.
      # Selector list is the P2 set in scripts/run_postgres_gate.sh; the step below asserts
      # they stay in sync so a rename cannot silently drop the gate.
      - name: Test PostgreSQL tenant-bootstrap vertical (scoped trust enforcement)
        shell: bash
        env:
          ACP_TEST_POSTGRES_ALLOW_DESTRUCTIVE: '1'
          ACP_TEST_POSTGRES_GATE_ACTIVE: '1'
          ACP_TEST_POSTGRES_SELECTOR_MODE: p2-tenant-bootstrap
          ACP_TEST_POSTGRES_URL: postgresql+psycopg://acgs_control_plane_test:g101-test-password-17@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/acgs_control_plane_test
        run: |
          set -euo pipefail
          selectors=(
            'tests/integration/test_tenant_bootstrap_vertical.py::test_real_api_postgres_bootstrap_allow_atomic'
            'tests/integration/test_tenant_bootstrap_vertical.py::test_real_api_postgres_bootstrap_refusal_matrix'
            'tests/integration/test_tenant_bootstrap_vertical.py::test_100_request_multiprocess_bootstrap_once'
          )
          for selector in "${selectors[@]}"; do
            grep -qF "'${selector}'" scripts/run_postgres_gate.sh \
              || { echo "selector drifted from scripts/run_postgres_gate.sh: ${selector}" >&2; exit 1; }
          done
          junit="${RUNNER_TEMP}/tenant-bootstrap-vertical.xml"
          .venv/bin/pytest -q --junitxml="$junit" "${selectors[@]}"
          ACP_JUNIT="$junit" .venv/bin/python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(os.environ["ACP_JUNIT"]).getroot().find("testsuite")
          totals = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(f"tenant-bootstrap vertical JUnit totals: {totals}")
          if totals != {"tests": 3, "failures": 0, "errors": 0, "skipped": 0}:
              sys.exit("the P2 tenant-bootstrap gate must run all 3 tests with zero skips")
          PY
