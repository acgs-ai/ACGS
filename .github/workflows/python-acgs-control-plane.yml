# Hash-locked, GitHub-hosted CI for packages/acgs-control-plane.
# The canonical cross-scope order lives in saas-beta-required.yml; this workflow
# preserves the package status context without offering a weaker green path.

name: python-acgs-control-plane

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/acgs-control-plane/**'
      - 'packages/gove-zone/**'
      - 'requirements/saas-beta/cp-test.lock'
      - 'requirements/saas-beta/locks.toml'
      - 'pyproject.toml'
      - '.github/workflows/python-acgs-control-plane.yml'
  push:
    branches: [master]
    paths:
      - 'packages/acgs-control-plane/**'
      - 'packages/gove-zone/**'
      - 'requirements/saas-beta/cp-test.lock'
      - 'requirements/saas-beta/locks.toml'
      - 'pyproject.toml'
      - '.github/workflows/python-acgs-control-plane.yml'

concurrency:
  group: python-acgs-control-plane-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up uv 0.11.19
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.19'
          enable-cache: false

      - name: Install the reviewed hash-locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.11 packages/acgs-control-plane/.venv
          uv pip sync --python packages/acgs-control-plane/.venv/bin/python --require-hashes requirements/saas-beta/cp-test.lock
          UV_OFFLINE=1 UV_NO_INDEX=1 UV_NO_CACHE=1 uv pip install --python packages/acgs-control-plane/.venv/bin/python --no-build-isolation --no-deps --editable packages/gove-zone
          UV_OFFLINE=1 UV_NO_INDEX=1 UV_NO_CACHE=1 uv pip install --python packages/acgs-control-plane/.venv/bin/python --no-build-isolation --no-deps --editable packages/acgs-control-plane

      - name: Lint
        working-directory: packages/acgs-control-plane
        run: .venv/bin/ruff check .

      - name: Format
        working-directory: packages/acgs-control-plane
        run: .venv/bin/ruff format --check .

      - name: Typecheck
        working-directory: packages/acgs-control-plane
        run: .venv/bin/mypy src/

      - name: Test
        working-directory: packages/acgs-control-plane
        run: .venv/bin/pytest -q

      - name: Fail-closed production posture
        working-directory: packages/acgs-control-plane
        run: .venv/bin/pytest -q tests/integration/test_production_posture.py::test_production_rejects_legacy_unsigned_routes tests/integration/test_production_posture.py::test_tenant_bootstrap_and_register_contract_stub_no_mutation
