# Release pipeline for packages/gove-zone.
# Publish is DOUBLY human-gated: (1) only a pushed tag gove-zone-v* reaches
# the publish job; (2) the job runs in the protected `pypi` environment
# (required reviewer). Uses PyPI Trusted Publishing (OIDC) — no stored token.
# workflow_dispatch runs build+check+attest only (dry run), never publish.

name: release-gove-zone

on:
  push:
    tags: ['gove-zone-v*']
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/gove-zone

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Guard — tag matches package version
        if: startsWith(github.ref, 'refs/tags/gove-zone-v')
        run: |
          tag_ver="${GITHUB_REF_NAME#gove-zone-v}"
          pkg_ver="$(uvx hatch version 2>/dev/null || uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/gove_zone/__init__.py').read_text()).group(1))")"
          [ "$tag_ver" = "$pkg_ver" ] || { echo "tag $tag_ver != package $pkg_ver"; exit 1; }
      - name: Build + distribution gate
        run: bash scripts/release_check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/gove-zone/dist/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

  publish:
    if: startsWith(github.ref, 'refs/tags/gove-zone-v')
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
