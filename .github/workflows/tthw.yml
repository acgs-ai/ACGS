# ACGI Time-to-Hello-World measurement (PLAN.md A4).
# This scheduled clean-runner gate measures install + dev-server HTTP shell
# readiness on Node 24. It is not a production deployment proof and not a
# headless browser visual proof.

name: acgi-tthw

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  tthw:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: acgi-ai/pnpm-lock.yaml

      - name: Verify exact tool identities
        run: test "$(node -p 'process.versions.node')" = 24.18.0 && test "$(pnpm --version)" = 9.15.4

      - name: Time to hello world
        env:
          ACGI_TTHW_BUDGET_SECONDS: 300
        run: bash acgi-ai/scripts/hello-world.sh
