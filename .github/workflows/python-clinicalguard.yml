# Path-filtered CI for packages/clinicalguard/ — clinical-domain governance agent.
# Triggers only when the submodule path, .gitmodules, or this workflow change.

name: python-clinicalguard

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/clinicalguard/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - '.github/workflows/python-clinicalguard.yml'
  push:
    branches: [master]
    paths:
      - 'packages/clinicalguard/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - '.github/workflows/python-clinicalguard.yml'

concurrency:
  group: python-clinicalguard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/clinicalguard

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      # Two-step checkout: see constitutional-hash.yml for rationale.
      # clinicalguard is one of the private repos that motivates the PAT.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        working-directory: ${{ github.workspace }}
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -n "${SUBMODULE_TOKEN}" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          # Init only this workflow's submodule. NOTE: currently expected to
          # FAIL until SUBMODULE_TOKEN is rotated to add Contents: Read on
          # dislovelhl/clinicalguard. Other workflows are insulated by the
          # selective init — see constitutional-hash.yml for rationale.
          git submodule sync -- packages/clinicalguard
          git submodule update --init --recursive -- packages/clinicalguard

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/clinicalguard/pyproject.toml'

      - name: Install (dev extras)
        run: uv pip install --system --editable '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest --import-mode=importlib -q
