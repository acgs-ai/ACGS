# Path-filtered CI for packages/clinicalguard/ — clinical-domain governance agent.
# Triggers only when the submodule path, .gitmodules, or this workflow change.

name: python-clinicalguard

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/clinicalguard/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - '.github/workflows/python-clinicalguard.yml'
  push:
    branches: [master]
    paths:
      - 'packages/clinicalguard/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - '.github/workflows/python-clinicalguard.yml'

concurrency:
  group: python-clinicalguard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/clinicalguard

jobs:
  test:
    # Block fork PRs: untrusted code must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      # Two-step checkout: see constitutional-hash.yml for rationale.
      # clinicalguard is one of the private repos that motivates the PAT.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        id: clinicalguard
        working-directory: ${{ github.workspace }}
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          # Ephemeral global gitconfig: this job runs on the self-hosted
          # runner as the operator's user, so a plain `git config --global`
          # would write SUBMODULE_TOKEN into the real ~/.gitconfig and
          # persist after the job. Redirect global config to a job-scoped
          # temp file instead; it dies with the job.
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/submodule-gitconfig"
          if [ -n "${SUBMODULE_TOKEN}" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule sync -- packages/clinicalguard
          if git submodule update --init --recursive -- packages/clinicalguard; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::packages/clinicalguard could not be initialized. Rotate SUBMODULE_TOKEN to include Contents: Read on dislovelhl/clinicalguard, then rerun this workflow for full verification."
          fi

      - uses: astral-sh/setup-uv@v3
        if: steps.clinicalguard.outputs.available == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/clinicalguard/pyproject.toml'

      - name: Install (dev extras)
        if: steps.clinicalguard.outputs.available == 'true'
        # uv's python-build-standalone toolchain works on the self-hosted
        # runner, where actions/setup-python has no prebuilds
        # (see constitutional-hash.yml for the same pattern).
        run: |
          uv python install ${{ matrix.python-version }}
          # --clear: the matrix jobs run sequentially on the same persistent
          # runner workdir, and checkout's git clean does not descend into
          # the submodule, so a .venv from the previous job may linger.
          uv venv --clear --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv --no-config --no-sources --editable '.[dev]'

      - name: Lint
        if: steps.clinicalguard.outputs.available == 'true'
        run: .venv/bin/python -m ruff check .

      - name: Test
        if: steps.clinicalguard.outputs.available == 'true'
        run: .venv/bin/python -m pytest --import-mode=importlib -q
