name: deterministic-eval

on:
  pull_request:
    paths:
      - "acgs_governance_eval_mvp/governed_mcp_v0/**"
      - "acgs_governance_eval_mvp/tests/test_governed_mcp_v0.py"
      - ".github/workflows/eval.yml"
  push:
    paths:
      - "acgs_governance_eval_mvp/governed_mcp_v0/**"
      - "acgs_governance_eval_mvp/tests/test_governed_mcp_v0.py"
      - ".github/workflows/eval.yml"

jobs:
  governed-mcp-v0:
    runs-on: [self-hosted, Linux, X64]
    env:
      PYTHONPATH: acgs_governance_eval_mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml 'pydantic>=2.10'

      - name: Run governed MCP v0 deterministic gate
        run: pytest acgs_governance_eval_mvp/tests/test_governed_mcp_v0.py -q
