# Path-filtered CI for packages/research-engine/ — `delve` self-deepening
# research engine. Triggers only when this package or this workflow change.
# No submodule init needed: research-engine is a first-class in-tree package,
# not a gitlink. It is a STRICT_TYPECHECK_PACKAGE (see root Makefile), so this
# workflow gates ruff + pytest + `mypy --strict` — the package's real gates.

name: python-research-engine

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/research-engine/**'
      - '.github/workflows/python-research-engine.yml'
  push:
    branches: [master]
    paths:
      - 'packages/research-engine/**'
      - '.github/workflows/python-research-engine.yml'

concurrency:
  group: python-research-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/research-engine

jobs:
  test:
    # Block fork PRs: untrusted code must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/research-engine/pyproject.toml'

      - name: Install (dev group)
        # Standalone CI: no parent uv workspace context. The package declares
        # zero runtime deps; ruff/pytest/mypy live in the PEP 735 [dependency-groups]
        # `dev` group, pulled with `--group dev`. Use uv's python-build-standalone
        # toolchain because actions/setup-python has no prebuilds for Ubuntu
        # 25.10 on the self-hosted runner. `--no-config` keeps the install
        # hermetic (no parent-workspace discovery).
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }} --clear .venv
          uv pip install --python .venv/bin/python --no-config --editable . --group dev

      - name: Lint
        # ruff config pins `src = ["src", "tests"]`; lint both like the root
        # Makefile (`make lint-py`) does for this package.
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests

      - name: Typecheck (mypy --strict)
        # research-engine is in STRICT_TYPECHECK_PACKAGES (root Makefile). Its
        # [tool.mypy] sets `strict = true` + `packages = ["delve"]`; the Makefile
        # `typecheck-py` runs `mypy src tests` from inside the package. `--strict`
        # is redundant with the config but pins the gate explicitly.
        run: .venv/bin/mypy --strict src tests

      - name: Test
        # `--import-mode=importlib` keeps tests insulated from sys.path leakage
        # from sibling packages.
        run: .venv/bin/python -m pytest tests/ -v --import-mode=importlib
