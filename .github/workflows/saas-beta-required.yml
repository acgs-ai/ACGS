# Canonical P0 SaaS-beta pull-request gate.
#
# This job is intentionally one ordered, GitHub-hosted, read-only transaction:
# EVID -> control plane -> gove-zone -> console -> root contract.  It carries no
# deployment authority and executes untrusted pull-request code only on an
# ephemeral hosted runner.  Enabling its check as required branch protection is
# an owner action; this file alone does not claim that repository setting exists.

name: saas-beta-required

on:
  pull_request:
    branches: [master]

concurrency:
  group: saas-beta-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: SaaS beta required gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COREPACK_DEFAULT_TO_LATEST: '0'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      COREPACK_ENABLE_PROJECT_SPEC: '1'
      COREPACK_ENABLE_STRICT: '1'
      COREPACK_ENV_FILE: '0'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up uv 0.11.19
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.19'
          enable-cache: false

      - name: Build hash-locked Python environments
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.11 .venv-evidence
          uv pip sync --python .venv-evidence/bin/python --require-hashes requirements/saas-beta/evidence-test.lock

          uv venv --python 3.11 packages/acgs-control-plane/.venv
          uv pip sync --python packages/acgs-control-plane/.venv/bin/python --require-hashes requirements/saas-beta/cp-test.lock
          UV_OFFLINE=1 UV_NO_INDEX=1 UV_NO_CACHE=1 uv pip install --python packages/acgs-control-plane/.venv/bin/python --no-build-isolation --no-deps --editable packages/gove-zone
          UV_OFFLINE=1 UV_NO_INDEX=1 UV_NO_CACHE=1 uv pip install --python packages/acgs-control-plane/.venv/bin/python --no-build-isolation --no-deps --editable packages/acgs-control-plane

          uv venv --python 3.11 packages/gove-zone/.venv-beta
          uv pip sync --python packages/gove-zone/.venv-beta/bin/python --require-hashes requirements/saas-beta/gz-test.lock
          UV_OFFLINE=1 UV_NO_INDEX=1 UV_NO_CACHE=1 uv pip install --python packages/gove-zone/.venv-beta/bin/python --no-build-isolation --no-deps --editable packages/gove-zone

      - name: Set up Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Prove Corepack enforces the integrity-qualified pnpm selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = 24.18.0
          test "$(corepack --version)" = 0.35.0
          if [[ -v COREPACK_INTEGRITY_KEYS ]]; then
            echo "COREPACK_INTEGRITY_KEYS must stay unset; bypasses are forbidden" >&2
            exit 1
          fi

          selector='pnpm@9.15.4+sha512.b2dc20e2fc72b3e18848459b37359a32064663e5627a51e4c74b2c29dd8e8e0491483c3abb40789cfd578bf362fb6ba8261b05f0387d76792ed6e23ea3b1b6a0'
          reviewed_hash="${selector##*+sha512.}"
          forged_hash="$(printf '%0128d' 0)"
          python3 - "$selector" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          root = json.loads(Path("package.json").read_text())["packageManager"]
          app = json.loads(Path("acgi-ai/package.json").read_text())["packageManager"]
          if root != expected or app != expected:
              raise SystemExit("root/acgi packageManager selector drift")
          PY

          corepack_root="$RUNNER_TEMP/acgs-corepack"
          export COREPACK_HOME="$corepack_root/home"
          forged_home="${corepack_root}-forged/home"
          valid_project="$(mktemp -d)"
          forged_project="$(mktemp -d)"
          trap 'rm -rf "$valid_project" "$forged_project"' EXIT
          rm -rf "$corepack_root" "${corepack_root}-forged"
          install -d -m 0700 "$COREPACK_HOME" "$forged_home" "$corepack_root/bin"
          printf '{"packageManager":"%s"}\n' "$selector" > "$valid_project/package.json"
          printf '{"packageManager":"pnpm@9.15.4+sha512.%s"}\n' "$forged_hash" > "$forged_project/package.json"

          test "$(cd "$valid_project" && corepack pnpm --version)" = 9.15.4
          if (cd "$forged_project" && COREPACK_HOME="$forged_home" corepack pnpm --version) \
            >"$RUNNER_TEMP/corepack-forged.stdout" \
            2>"$RUNNER_TEMP/corepack-forged.stderr"; then
            echo "Corepack accepted a forged pnpm SHA-512 selector" >&2
            exit 1
          fi
          grep -F "Error: Mismatch hashes. Expected ${forged_hash}, got ${reviewed_hash}" \
            "$RUNNER_TEMP/corepack-forged.stderr"

          corepack enable --install-directory "$corepack_root/bin" pnpm
          test "$(COREPACK_HOME="$COREPACK_HOME" "$corepack_root/bin/pnpm" --version)" = 9.15.4
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$corepack_root/bin" >> "$GITHUB_PATH"

      - name: Install the locked console dependency graph
        working-directory: acgi-ai
        run: |
          test "$(command -v pnpm)" = "${COREPACK_HOME%/home}/bin/pnpm"
          test "$(pnpm --version)" = 9.15.4 || { echo "pnpm identity drift" >&2; exit 1; }
          pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Playwright Chromium on the ephemeral runner
        working-directory: acgi-ai
        run: pnpm exec playwright install --with-deps chromium

      - name: Bind reviewed fnm argv to the already-pinned Actions toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acgs-ci-bin"
          cat > "$RUNNER_TEMP/acgs-ci-bin/fnm" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -lt 5 || "$1" != exec || "$2" != --using || "$3" != 24.18.0 || "$4" != -- ]]; then
            echo "fnm CI adapter accepts only: fnm exec --using 24.18.0 -- <command>" >&2
            exit 64
          fi
          shift 4
          [[ "$(node -p 'process.versions.node')" == 24.18.0 ]] || { echo "Node identity drift" >&2; exit 1; }
          [[ "$(command -v pnpm)" == "${COREPACK_HOME%/home}/bin/pnpm" ]] || { echo "pnpm shim drift" >&2; exit 1; }
          [[ "$(pnpm --version)" == 9.15.4 ]] || { echo "pnpm identity drift" >&2; exit 1; }
          exec "$@"
          EOF
          chmod 0555 "$RUNNER_TEMP/acgs-ci-bin/fnm"
          echo "$RUNNER_TEMP/acgs-ci-bin" >> "$GITHUB_PATH"

      - name: Gate 01 - evidence interpreter
        run: .venv-evidence/bin/python -m pytest -q tests/saas_beta/test_evidence_bootstrap.py::test_universal_evidence_interpreter_offline

      - name: Gate 02 - control-plane lint
        working-directory: packages/acgs-control-plane
        run: .venv/bin/ruff check .

      - name: Gate 03 - control-plane format
        working-directory: packages/acgs-control-plane
        run: .venv/bin/ruff format --check .

      - name: Gate 04 - control-plane types
        working-directory: packages/acgs-control-plane
        run: .venv/bin/mypy src/

      - name: Gate 05 - control-plane suite
        working-directory: packages/acgs-control-plane
        run: .venv/bin/pytest -q

      - name: Gate 06 - fail-closed control-plane posture
        working-directory: packages/acgs-control-plane
        run: .venv/bin/pytest -q tests/integration/test_production_posture.py::test_production_rejects_legacy_unsigned_routes tests/integration/test_production_posture.py::test_tenant_bootstrap_and_register_contract_stub_no_mutation

      - name: Gate 07 - gove-zone lint
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/packages/gove-zone/.venv-beta
        run: uv run --active --no-sync --python 3.11 --package gove-zone ruff check packages/gove-zone/src packages/gove-zone/tests packages/gove-zone/examples

      - name: Gate 08 - gove-zone format
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/packages/gove-zone/.venv-beta
        run: uv run --active --no-sync --python 3.11 --package gove-zone ruff format --check packages/gove-zone/src packages/gove-zone/tests packages/gove-zone/examples

      - name: Gate 09 - gove-zone types
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/packages/gove-zone/.venv-beta
        run: uv run --active --no-sync --python 3.11 --package gove-zone mypy packages/gove-zone/src/gove_zone

      - name: Gate 10 - gove-zone suite and coverage
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/packages/gove-zone/.venv-beta
        run: uv run --active --no-sync --python 3.11 --package gove-zone python -m pytest packages/gove-zone/tests --import-mode=importlib -q --cov=gove_zone --cov-fail-under=90

      - name: Gate 11 - console lint
        working-directory: acgi-ai
        run: fnm exec --using 24.18.0 -- pnpm lint

      - name: Gate 12 - console build
        working-directory: acgi-ai
        run: fnm exec --using 24.18.0 -- pnpm build

      - name: Gate 13 - console readiness
        working-directory: acgi-ai
        run: fnm exec --using 24.18.0 -- pnpm test:all

      - name: Gate 14 - console unit suite
        working-directory: acgi-ai
        run: fnm exec --using 24.18.0 -- pnpm test:unit

      - name: Gate 15 - console browser suite
        working-directory: acgi-ai
        run: fnm exec --using 24.18.0 -- pnpm test:playwright

      - name: Gate 16 - required-gate contract
        run: packages/acgs-control-plane/.venv/bin/python -m pytest -q tests/saas_beta/test_ci_gate_contract.py::test_all_owned_scope_gates_are_required
