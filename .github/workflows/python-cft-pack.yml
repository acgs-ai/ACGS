# Path-filtered CI for acgs-cft-governance-pack/ — GCP CFT governance policy pack.
# Triggers only when files under this package change.

name: python-cft-pack

on:
  pull_request:
    branches: [master]
    paths:
      - 'acgs-cft-governance-pack/**'
      - 'pyproject.toml'
      - '.github/workflows/python-cft-pack.yml'
  push:
    branches: [master]
    paths:
      - 'acgs-cft-governance-pack/**'
      - 'pyproject.toml'
      - '.github/workflows/python-cft-pack.yml'

concurrency:
  group: python-cft-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: acgs-cft-governance-pack

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'acgs-cft-governance-pack/pyproject.toml'

      - name: Install
        # `--system` targets the active Python from setup-python above
        # (a hostedtoolcache interpreter), not /usr — which is PEP 668
        # externally-managed on current ubuntu-latest runners.
        run: uv pip install --system --editable '.[test]'

      - name: Lint
        run: |
          uvx ruff@0.8 check .
          uvx ruff@0.8 format --check .

      - name: Test
        run: python -m pytest tests/ -v --import-mode=importlib

      - name: CLI smoke (acgs-cft-govern --help must exit 0)
        run: acgs-cft-govern --help
