# GitHub-hosted advisory twin of `tests-root.yml`.
#
# WHY: every meaningful gate in this repo (`verify`, `test`, `tests-root`, all
# per-package suites, deploys) runs on the single `[self-hosted, Linux, X64]`
# runner. If that one box is offline, those checks sit `pending` indefinitely —
# there is no independent signal that the codebase is healthy.
#
# This job mirrors `tests-root.yml`'s environment-INDEPENDENT invariant guards
# (82 tests) onto a GitHub-hosted runner (free for public repos). It is a
# generic root gate, so the locked SaaS-beta proof is excluded here and runs in
# the automatic hosted contract lane in `saas-beta-p0-evidence.yml`; its exact
# proof remains authorized/manual on its authenticated self-hosted environment. It is a
# faithful copy of that gate's run step — the ONLY difference is `runs-on` —
# so the two never diverge in what they assert. The self-hosted `tests-root`
# remains the authority; this is a redundant safety net for runner outages.
#
# ADVISORY BY DESIGN: a newly-added check is not a required status check until a
# human adds it to branch protection. Leave it advisory, or promote it to
# required once you trust it — same "agent preps, human flips the switch"
# pattern as repo secrets. Keep the run step in lockstep with `tests-root.yml`.

name: tests-root-hosted

on:
  pull_request:
    branches: [master]
    paths:
      - 'tests/**'
      - 'tools/kg/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.claude/settings.json'
      - 'automation/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docs/PLAN-MONOREPO.md'
      - 'docs/constitutional-hashes.lock'
      # The claim-safety gate validates these two documents directly
      # (test_repository_documents_currently_pass); a docs-only edit to either
      # must trigger this workflow or the gate is stale-green for the exact
      # change it guards.
      - 'docs/governance-stack-index.md'
      - 'docs/integration-readiness-task-map.md'
  push:
    branches: [master]
    paths:
      - 'tests/**'
      - 'tools/kg/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.claude/settings.json'
      - 'automation/**'
      - 'pyproject.toml'
      - 'Makefile'
      - 'docs/PLAN-MONOREPO.md'
      - 'docs/constitutional-hashes.lock'
      - 'docs/governance-stack-index.md'
      - 'docs/integration-readiness-task-map.md'

concurrency:
  group: tests-root-hosted-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Root invariants (GitHub-hosted advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Submodules intentionally NOT initialized — these guards read
      # parent-tracked files only; the submodule-dependent tests are excluded
      # below, identically to tests-root.yml.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: astral-sh/setup-uv@v3

      - name: Run root governance-invariant guards
        # Lockstep copy of tests-root.yml. `--no-project` skips the workspace
        # sync; `--with` supplies the only deps these tests need (pytest,
        # pyyaml, and cryptography: the signature-verification guards FAIL
        # rather than skip without the Ed25519 backend, so omitting it here
        # would bury the intended redundant signal under 58 unrelated
        # failures). tests/conftest.py puts scripts/ on sys.path. EXCLUSIONS match
        # tests-root.yml exactly — tests/saas_beta uses the automatic hosted
        # contract lane; its exact proof remains authorized/manual. The five
        # readiness/evidence tests are gated
        # by readiness-evidence.yml (+ hosted twin); submodule-dependent tests
        # stay out of this gate.
        run: |
          uv python install 3.11
          uv run --no-project --python 3.11 --with pytest==9.1.1 --with pyyaml==6.0.3 --with cryptography==50.0.0 \
            python -m pytest tests/ \
            --ignore=tests/docs \
            --ignore=tests/saas_beta \
            --ignore=tests/test_platform_readiness_report.py \
            --ignore=tests/test_readiness_evidence_boundaries.py \
            --ignore=tests/test_release_evidence_bundle.py \
            --ignore=tests/test_production_blocker_evidence.py \
            --ignore=tests/test_production_launch_preflight.py \
            -k "not test_acgs_lite_published_floor_unchanged and not test_acgs_swarm_floor_drives_workspace_floor and not test_typecheck_py_uses_configured_mypy_scope" \
            -v --import-mode=importlib
