# Path-filtered CI for packages/acgs-lite/ — published PyPI library (v2.10.0+).
# Triggers only when the submodule path, .gitmodules, or this workflow change.
# Uses the package's own Makefile (lint / typecheck / test) so parent CI never
# diverges from the per-package gate documented in CLAUDE.md.

name: python-acgs-lite

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/acgs-lite/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - '.github/workflows/python-acgs-lite.yml'
  push:
    branches: [master]
    paths:
      - 'packages/acgs-lite/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - '.github/workflows/python-acgs-lite.yml'

concurrency:
  group: python-acgs-lite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/acgs-lite

jobs:
  test:
    # Block fork PRs: untrusted code must not run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    strategy:
      matrix:
        # Published floor is 3.10 (preserved in package metadata); workspace
        # floor is 3.11. Run both so we catch 3.10-only breakage and stay
        # honest about what PyPI consumers actually experience.
        python-version: ['3.10', '3.11', '3.12']
    steps:
      # Two-step checkout: see constitutional-hash.yml for rationale.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        working-directory: ${{ github.workspace }}
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          # Ephemeral global gitconfig: this job runs on the self-hosted
          # runner as the operator's user, so a plain `git config --global`
          # would write SUBMODULE_TOKEN into the real ~/.gitconfig and
          # persist after the job. Redirect global config to a job-scoped
          # temp file instead; it dies with the job.
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/submodule-gitconfig"
          if [ -n "${SUBMODULE_TOKEN}" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          # Init only this workflow's submodule — avoids tripping on
          # other submodules' PAT-scope gaps (notably clinicalguard).
          git submodule sync -- packages/acgs-lite
          git submodule update --init --recursive -- packages/acgs-lite

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/acgs-lite/pyproject.toml'

      # actions/setup-python@v5 has no prebuilt CPython for this self-hosted
      # runner's OS, so it fails with "version not found for this operating
      # system" (notably on the 3.10 published-floor lane). Provision the
      # matrix Python with uv — the same self-contained pattern already used by
      # python-agent-bus-analyzer.yml / python-eval-mvp.yml — and put the venv
      # on PATH so the Makefile's `python3 -m ruff/mypy/pytest` resolves to it.
      - name: Provision Python ${{ matrix.python-version }} via uv
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }} --clear .venv
          echo "${{ github.workspace }}/packages/acgs-lite/.venv/bin" >> "$GITHUB_PATH"

      - name: Install (dev extras)
        run: uv pip install --python .venv/bin/python --no-config --no-sources --editable '.[dev,mcp]'

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test
