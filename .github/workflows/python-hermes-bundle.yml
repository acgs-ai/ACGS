# Path-filtered CI for hermes_acgs_bundle/ — flat-layout Python module
# (Hermes + ACGS middleware + chain-hashed evidence writer).
# No pyproject.toml — runs pytest directly against tests/ with deps installed
# from the package's docker-compose-derived requirements.

name: python-hermes-bundle

on:
  pull_request:
    branches: [master]
    paths:
      - 'hermes_acgs_bundle/**'
      - '.github/workflows/python-hermes-bundle.yml'
  push:
    branches: [master]
    paths:
      - 'hermes_acgs_bundle/**'
      - '.github/workflows/python-hermes-bundle.yml'

concurrency:
  group: python-hermes-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: hermes_acgs_bundle

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v3
        # No `enable-cache: true` — the action defaults to caching by
        # `**/uv.lock`, and hermes-bundle is a flat-layout module with
        # no pyproject.toml or uv.lock, so the cache key never resolves
        # and the step errors with "No matches found for glob".

      - name: Install minimum deps (no pyproject)
        # `--system` targets the active Python from setup-python above
        # (a hostedtoolcache interpreter), not /usr — which is PEP 668
        # externally-managed on current ubuntu-latest runners.
        run: |
          uv pip install --system \
            pytest>=8.0 \
            pyyaml>=6.0 \
            opentelemetry-api>=1.24 \
            opentelemetry-sdk>=1.24

      - name: Test
        run: python -m pytest tests/ -v --import-mode=importlib
