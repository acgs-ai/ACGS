# Path-filtered CI for hermes_acgs_bundle/ — flat-layout Python module
# (Hermes + ACGS middleware + chain-hashed evidence writer).
# No pyproject.toml — runs pytest directly against tests/ with deps installed
# from hermes_acgs_bundle/requirements-test.txt (the same file used locally).

name: python-hermes-bundle

on:
  pull_request:
    branches: [master]
    paths:
      - 'hermes_acgs_bundle/**'
      - '.github/workflows/python-hermes-bundle.yml'
  push:
    branches: [master]
    paths:
      - 'hermes_acgs_bundle/**'
      - '.github/workflows/python-hermes-bundle.yml'

concurrency:
  group: python-hermes-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: hermes_acgs_bundle

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        # No `enable-cache: true` — the action defaults to caching by
        # `**/uv.lock`, and hermes-bundle is a flat-layout module with
        # no pyproject.toml or uv.lock, so the cache key never resolves
        # and the step errors with "No matches found for glob".

      - name: Set up Python via uv
        # The self-hosted runner has no actions/setup-python prebuilds for this
        # OS (setup-python fails with "version '3.11' ... was not found"), so uv
        # provisions the interpreter itself — matching python-gove-zone.yml.
        run: |
          uv python install 3.11
          uv venv --python 3.11 .venv

      - name: Install test deps
        # Single source of truth: hermes_acgs_bundle/requirements-test.txt — the
        # same file `uv run --with-requirements ... pytest` uses locally.
        run: uv pip install --python .venv/bin/python -r requirements-test.txt

      - name: Test
        run: .venv/bin/python -m pytest tests/ -v --import-mode=importlib
