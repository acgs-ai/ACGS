# Path-filtered CI for hermes_acgs_bundle/ — flat-layout Python module
# (Hermes + ACGS middleware + chain-hashed evidence writer).
# Runs pytest directly against tests/ with deps installed from
# hermes_acgs_bundle/requirements-test.txt (the same file used locally).
# The package has a pyproject.toml for packaging metadata, but the canonical
# test-dep source stays requirements-test.txt to match local usage.

name: python-hermes-bundle

on:
  pull_request:
    branches: [master]
    paths:
      - 'hermes_acgs_bundle/**'
      - '.github/workflows/python-hermes-bundle.yml'
  push:
    branches: [master]
    paths:
      - 'hermes_acgs_bundle/**'
      - '.github/workflows/python-hermes-bundle.yml'

concurrency:
  group: python-hermes-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: hermes_acgs_bundle

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Deps install from requirements-test.txt (not pyproject/uv.lock),
          # so the cache key must track that file.
          cache-dependency-glob: 'hermes_acgs_bundle/requirements-test.txt'

      - name: Install (test deps + pinned ruff)
        # The self-hosted runner has no actions/setup-python prebuilds for this
        # OS, so uv provisions the interpreter itself — matching the other
        # per-package Python workflows. Ruff is pinned to the same version as
        # python-eval-mvp.yml so CI formats identically to `make lint-py`
        # (which resolves the workspace-locked ruff, same 0.15 minor).
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }} --clear .venv
          uv pip install --python .venv/bin/python -r requirements-test.txt 'ruff==0.15.12'

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Test
        run: .venv/bin/python -m pytest tests/ -v --import-mode=importlib
