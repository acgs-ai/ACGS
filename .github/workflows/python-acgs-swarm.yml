# Path-filtered CI for packages/Acgs-Swarm/ — constitutional swarm research package.
# Triggers only when the submodule path, .gitmodules, or this workflow change.

name: python-acgs-swarm

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/Acgs-Swarm/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - '.github/workflows/python-acgs-swarm.yml'
  push:
    branches: [master]
    paths:
      - 'packages/Acgs-Swarm/**'
      - '.gitmodules'
      - 'pyproject.toml'
      - '.github/workflows/python-acgs-swarm.yml'

concurrency:
  group: python-acgs-swarm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/Acgs-Swarm

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      # Two-step checkout: see constitutional-hash.yml for rationale.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules
        working-directory: ${{ github.workspace }}
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -n "${SUBMODULE_TOKEN}" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          # Init only this workflow's submodule — avoids tripping on
          # other submodules' PAT-scope gaps (notably clinicalguard).
          git submodule sync -- packages/Acgs-Swarm
          git submodule update --init --recursive -- packages/Acgs-Swarm

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'packages/Acgs-Swarm/pyproject.toml'

      # See python-acgs-lite.yml: actions/setup-python@v5 has no prebuild for
      # this self-hosted runner's OS. Provision the matrix Python with uv and
      # put the venv on PATH so `python -m ruff/pytest` resolves to it.
      - name: Provision Python ${{ matrix.python-version }} via uv
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }} --clear .venv
          echo "${{ github.workspace }}/packages/Acgs-Swarm/.venv/bin" >> "$GITHUB_PATH"

      - name: Install (dev extras)
        run: uv pip install --python .venv/bin/python --no-config --no-sources --editable '.[dev]'

      - name: Lint
        run: python -m ruff check src/

      - name: Test (dev matrix — excludes research + bittensor markers)
        run: |
          python -m pytest tests/ \
            --import-mode=importlib \
            -q \
            -m 'not research and not bittensor' \
            --maxfail=10
