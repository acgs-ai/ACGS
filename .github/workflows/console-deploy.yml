# Console production publication and Cloud Run deployment.
#
# This workflow has no pull_request trigger. It independently verifies the exact
# master commit before entering production-environment jobs. Only jobs that call
# Google WIF receive OIDC token-minting authority.

name: console-deploy

on:
  push:
    branches: [master]
    paths:
      - 'acgi-ai/src/**'
      - 'acgi-ai/public/**'
      - 'acgi-ai/index.html'
      - 'acgi-ai/package.json'
      - 'acgi-ai/pnpm-lock.yaml'
      - 'acgi-ai/pnpm-workspace.yaml'
      - 'acgi-ai/scripts/**'
      - 'acgi-ai/contracts/**'
      - 'acgi-ai/tests/**'
      - 'acgi-ai/playwright.config.ts'
      - 'acgi-ai/vite.config.ts'
      - 'acgi-ai/tsconfig*.json'
      - 'acgi-ai/infra/**'
      - 'acgi-ai/DEPLOY.md'
      - 'acgi-ai/PRODUCTION-LAUNCH.md'
      - 'acgi-ai/production-authority.example.json'
      - 'acgi-ai/production-evidence.example.json'
      - 'acgi-ai/hosted-storybook-proof.example.json'
      - 'acgi-ai/storybook-runtime.plan.json'
      - 'acgi-ai/A11Y.md'
      - 'acgi-ai/ARCHITECTURE.md'
      - 'acgi-ai/INTEGRATING.md'
      - 'acgi-ai/GETTING_STARTED.md'
      - 'docs/integration-readiness-task-map.md'
      - '.github/workflows/console.yml'
      - '.github/workflows/console-deploy.yml'

concurrency:
  group: console-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  REVIEWED_PNPM_SELECTOR: 'pnpm@9.15.4+sha512.b2dc20e2fc72b3e18848459b37359a32064663e5627a51e4c74b2c29dd8e8e0491483c3abb40789cfd578bf362fb6ba8261b05f0387d76792ed6e23ea3b1b6a0'

defaults:
  run:
    working-directory: acgi-ai

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - name: Activate integrity-verified pnpm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = '24.18.0'
          test "$(node -p "require('./package.json').packageManager")" = "$REVIEWED_PNPM_SELECTOR"
          corepack_root="$RUNNER_TEMP/acgs-corepack"
          rm -rf "$corepack_root"
          install -d -m 0700 "$corepack_root/home" "$corepack_root/bin"
          export COREPACK_HOME="$corepack_root/home"
          corepack enable --install-directory "$corepack_root/bin"
          export PATH="$corepack_root/bin:$PATH"
          test "$(corepack pnpm --version)" = '9.15.4'
          test "$(pnpm --version)" = '9.15.4'
          test "$(command -v pnpm)" = "$corepack_root/bin/pnpm"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$corepack_root/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Gate 1 - lint
        run: pnpm lint

      - name: Gate 2 - build
        run: pnpm build

      - name: Gate 3 - readiness
        run: pnpm test:all

      - name: Gate 4 - unit suite
        run: pnpm test:unit

      - name: Gate 5 - browser suite
        run: pnpm test:playwright

      - name: Upload verified console artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-dist
          path: acgi-ai/dist
          if-no-files-found: error

  # Set CONSOLE_PRODUCTION_APPROVED_SHA on the production environment to the
  # exact 40-hex commit to authorize. This job checks no repository code and
  # receives no token, OIDC, or secret authority. An unset, malformed, stale,
  # or different value keeps verification green while all side effects skip.
  authorize:
    needs: verify
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      approved: ${{ steps.commit_authorization.outputs.approved }}
    steps:
      - name: Authorize exact console production commit
        id: commit_authorization
        env:
          APPROVED_SHA: ${{ vars.CONSOLE_PRODUCTION_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ && "$APPROVED_SHA" == "$CANDIDATE_SHA" ]]; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'approved=false' >> "$GITHUB_OUTPUT"
          echo '::notice::Console production skipped: set production environment variable CONSOLE_PRODUCTION_APPROVED_SHA to this exact commit, then rerun.'

  publish:
    needs: [verify, authorize]
    if: needs.authorize.outputs.approved == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - id: auth
        name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Configure Artifact Registry authentication
        env:
          ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_REGISTRY"
          gcloud auth configure-docker "${ARTIFACT_REGISTRY%%/*}" --quiet

      - name: Compute immutable image URI
        id: image
        env:
          ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_REGISTRY"
          printf 'uri=%s/acgi-console:%s\n' "$ARTIFACT_REGISTRY" "${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and publish console image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: acgi-ai
          file: acgi-ai/infra/Dockerfile.console
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [verify, authorize, publish]
    if: needs.authorize.outputs.approved == 'true' && needs.publish.result == 'success'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          submodules: false

      - name: Download verified console artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: console-dist
          path: acgi-ai/dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'

      - id: auth
        name: Authenticate to GCP with Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Render reviewed Cloud Run service
        env:
          DEPLOY_ENV: production
          AUTH_UPSTREAM: ${{ secrets.CONSOLE_AUTH_UPSTREAM }}
          BUS_UPSTREAM: ${{ secrets.CONSOLE_BUS_UPSTREAM }}
          IMAGE_URI: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$AUTH_UPSTREAM"
          test -n "$BUS_UPSTREAM"
          test -n "$IMAGE_URI"
          node scripts/render-cloudrun-service.mjs \
            --env "$DEPLOY_ENV" \
            --image "$IMAGE_URI" \
            --build-id "${GITHUB_SHA::12}" \
            --auth-upstream "$AUTH_UPSTREAM" \
            --bus-upstream "$BUS_UPSTREAM" \
            --out infra/cloudrun/service.yaml

      - name: Deploy to Cloud Run
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$GCP_REGION"
          test -n "$GCP_PROJECT_ID"
          gcloud run services replace infra/cloudrun/service.yaml \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID"

      - name: Verify deployed console
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe acgi-console \
            --region="$GCP_REGION" \
            --project="$GCP_PROJECT_ID" \
            --format='value(status.url)')"
          test -n "$URL"
          EXPECTED_BUILD_ID="${GITHUB_SHA::12}" bash scripts/postdeploy-verify.sh "$URL"
