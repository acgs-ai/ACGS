# GitHub Pages build for https://acgs-ai.github.io/ACGS/
#
# RETIRED 2026-08-17 — automatic triggers removed; `workflow_dispatch` only.
#
# The repository is private and its Pages site no longer exists
# (`GET /repos/acgs-ai/ACGS/pages` -> 404, `has_pages: false`), so
# actions/configure-pages@v5 fails at the first step of `build` on every run:
#
#   Get Pages site failed. Please verify that the repository has Pages enabled
#   and configured to build using GitHub Actions ... Error: Not Found
#
# `deploy` is then skipped, so nothing is published and no code is ever built.
# That reddened every push to master from adcc688ad (2026-08-17) onward with a
# failure that no code change can fix. acgs.ai itself is served by Cloudflare
# Workers Assets, not by this workflow, so nothing user-facing depends on it.
#
# The job definitions below are left intact and runnable via the Actions "Run
# workflow" button. To bring the docs site back: re-enable Pages on the repo
# with source "GitHub Actions", confirm `GET .../pages` returns 200, then
# restore the `push:` / `pull_request:` triggers recorded in the block below.
#
# Replaces the legacy "deploy from branch" Pages build, which recursively
# clones every submodule and has failed on every push since
# packages/acgs-control-plane became a private submodule (#429): the legacy
# builder's token cannot read private submodules, so the site froze on a
# pre-#429 snapshot with 60+ errored builds behind it.
#
# This workflow checks out WITHOUT submodules — the rendered site is the
# repository's own markdown; no submodule content was ever part of it — and
# publishes through the Actions deployment path. Pages' source must be set to
# "GitHub Actions" (build_type: workflows) for this to take effect.
name: pages

on:
  # Retired: manual only. The automatic triggers are preserved verbatim below
  # so restoring them is a comment-uncomment once Pages is enabled again.
  #
  # push:
  #   branches: [master]
  #   # Only publishable content should trigger a deploy. _config.yml excludes
  #   # the source trees (packages/, tests/, acgi-ai/, ...) from the rendered
  #   # site, so pushes confined to them would rebuild an identical artifact.
  #   paths:
  #     - '_config.yml'
  #     - '*.md'
  #     - 'llms.txt'
  #     - 'LICENSE'
  #     - 'docs/**'
  #     - '.github/workflows/pages.yml'
  # pull_request:
  #   # Dry-run the Jekyll build (deploy is master-gated below) whenever site
  #   # content or this workflow changes — Liquid parse failures surface on the
  #   # PR instead of after merge.
  #   paths:
  #     - '_config.yml'
  #     - '*.md'
  #     - 'llms.txt'
  #     - 'LICENSE'
  #     - 'docs/**'
  #     - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one queued run to supersede older queued runs, but never cancel an
# in-progress run: deploy-pages creates an external deployment and waits on
# it, so cancelling mid-deploy can leave the production deployment stuck in a
# cancelled state or overlapping its replacement.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # storybook.yml also publishes to this repository's single Pages site when
    # STORYBOOK_PAGES_ENABLED is 'true'. A repo has exactly one Pages site, so
    # two publishers would overwrite each other's artifact; while that flag is
    # enabled, this docs publisher stands down (deploy is skipped transitively).
    if: vars.STORYBOOK_PAGES_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deliberate: the remaining private submodules are unreadable here
          # and were never part of the rendered site. (acgs-control-plane is
          # now vendored in-tree, and `packages/` is excluded in _config.yml.)
          submodules: false

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    # Build runs on branches too (workflow_dispatch) as a dry-run gate;
    # only master deploys.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
