# Path-filtered CI for acgs_governance_eval_mvp/ — Python eval surface.
# Triggers only when files under this package change.

name: python-eval-mvp

on:
  pull_request:
    branches: [master]
    paths:
      - 'acgs_governance_eval_mvp/**'
      - 'pyproject.toml'
      - '.github/workflows/python-eval-mvp.yml'
  push:
    branches: [master]
    paths:
      - 'acgs_governance_eval_mvp/**'
      - 'pyproject.toml'
      - '.github/workflows/python-eval-mvp.yml'

concurrency:
  group: python-eval-mvp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: acgs_governance_eval_mvp

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'acgs_governance_eval_mvp/pyproject.toml'

      - name: Install
        # Provision the matrix Python via uv's python-build-standalone toolchain
        # instead of actions/setup-python — the latter has no prebuilds for
        # Ubuntu 25.10 on the self-hosted runner. uv resolves the interpreter
        # against a portable distribution and creates the venv directly.
        # Ruff is installed alongside test deps so CI uses the same minor
        # version `make lint-py` resolves against the workspace lockfile.
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python --editable '.[test]' 'ruff==0.15.12'

      - name: Lint
        # Use the project-pinned ruff from the dev install, not uvx ruff@0.8.
        # The pin in pyproject is `ruff>=0.8`, but 0.8 formats differently from
        # current minor versions; pinning CI to 0.8 caused drift with
        # `make lint-py` (which uses the locked ruff).
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Authorization trace receipt tests
        run: |
          .venv/bin/python -m pytest tests/test_authorization_trace_receipts.py -q

      - name: Test
        run: |
          .venv/bin/python -m pytest tests/ -v --import-mode=importlib
