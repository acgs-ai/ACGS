# Path-filtered CI for acgs_governance_eval_mvp/ — Python eval surface.
# Triggers only when files under this package change.

name: python-eval-mvp

on:
  pull_request:
    branches: [master]
    paths:
      - 'acgs_governance_eval_mvp/**'
      - 'pyproject.toml'
      - '.github/workflows/python-eval-mvp.yml'
  push:
    branches: [master]
    paths:
      - 'acgs_governance_eval_mvp/**'
      - 'pyproject.toml'
      - '.github/workflows/python-eval-mvp.yml'

concurrency:
  group: python-eval-mvp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: acgs_governance_eval_mvp

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'acgs_governance_eval_mvp/pyproject.toml'

      - name: Install
        # Pin to the interpreter setup-python resolved (the matrix version,
        # exposed via ${pythonLocation}). Plain `uv pip install --system`
        # resolves Python via PATH, which on self-hosted Fedora picks up
        # /usr/bin/python3 (3.14) instead of the matrix version, then fails
        # with EACCES writing into /usr/local/lib/python3.14/site-packages.
        # `--python <path>` makes the choice explicit and works on both
        # ubuntu-latest and self-hosted runners.
        run: uv pip install --python "${pythonLocation}/bin/python" --editable '.[test]'

      - name: Lint
        run: |
          uvx ruff@0.8 check .
          uvx ruff@0.8 format --check .

      - name: Test
        run: "${pythonLocation}/bin/python" -m pytest tests/ -v --import-mode=importlib
