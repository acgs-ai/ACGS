# Path-filtered CI for acgs_governance_eval_mvp/ — Python eval surface.
# Triggers only when files under this package change.

name: python-eval-mvp

on:
  pull_request:
    branches: [master]
    paths:
      - 'acgs_governance_eval_mvp/**'
      - 'pyproject.toml'
      - '.github/workflows/python-eval-mvp.yml'
  push:
    branches: [master]
    paths:
      - 'acgs_governance_eval_mvp/**'
      - 'pyproject.toml'
      - '.github/workflows/python-eval-mvp.yml'

concurrency:
  group: python-eval-mvp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: acgs_governance_eval_mvp

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: 'acgs_governance_eval_mvp/pyproject.toml'

      - name: Install
        # Create a per-matrix venv off the setup-python interpreter and
        # install into that. Plain `uv pip install --system` resolves Python
        # via PATH (picks /usr/bin/python3 on Fedora self-hosted = wrong
        # version, EACCES), and `--python <managed>` is rejected by uv as
        # externally-managed. The venv path works on both ubuntu-latest and
        # self-hosted Fedora.
        run: |
          uv venv --python "${pythonLocation}/bin/python" .venv
          uv pip install --python .venv/bin/python --editable '.[test,dev]'

      - name: Lint
        run: |
          uvx ruff@0.8 check .
          uvx ruff@0.8 format --check .

      - name: Authorization trace receipt tests
        run: |
          .venv/bin/python -m pytest tests/test_authorization_trace_receipts.py -q

      - name: Test
        run: |
          .venv/bin/python -m pytest tests/ -v --import-mode=importlib
