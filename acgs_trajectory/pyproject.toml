[project]
name = "acgs-trajectory"
version = "0.1.0"
description = "ACGS governed ingestion foundation — Claude Code sessions to governance_trajectory/v2 (Phase 1: ingestion only)."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
acgs-ingest = "acgs_trajectory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acgs_trajectory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
