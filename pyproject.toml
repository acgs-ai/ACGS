# govern-zone monorepo workspace root.
#
# Virtual workspace — this root is NOT a publishable package. It exists to
# coordinate Python sub-packages via uv workspace, share dev tooling, and
# pin a common Python floor for local development.
#
# Per-package metadata (description, dependencies, requires-python) lives in
# each member's own pyproject.toml and is the source of truth for publishing.
# Notably: packages/acgs-lite ships to PyPI with `requires-python = ">=3.10"`.
# The workspace floor below (3.11) is local-only and matches Acgs-Swarm.

[project]
name = "govern-zone"
version = "0.0.0"
description = "ACGS GovernZone monorepo workspace root (not published)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ACGS Team", email = "hello@acgs.dev" }]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/acgs-lite",
    "packages/Acgs-Swarm",
    "packages/clinicalguard",
    "packages/gove-zone",
    "packages/acgs-proofpack-verifier",
    "packages/agent-bus-analyzer",
    "packages/acgs-control-plane",
    "acgs_governance_eval_mvp",
    "acgs-cft-governance-pack",
    "packages/research-engine",
]

# Phase-3 workspace source mapping (docs/PLAN-MONOREPO.md). acgs-lite's optional
# `gove` extra depends on gove-zone, another workspace member; without this
# mapping `uv sync --all-extras` fails to resolve gove-zone. Metadata-only —
# does not affect any published PyPI wheel.
[tool.uv.sources]
gove-zone = { workspace = true }

# Optional: cross-link members so local edits to acgs-lite flow into Acgs-Swarm
# without manual `pip install -e`. uv does this automatically when both are
# workspace members AND the consumer's [project.dependencies] references the
# member name. PyPI publish artifacts are NOT affected by this — published
# wheels resolve dependencies from PyPI as normal.
#
# Phase 3 of docs/PLAN-MONOREPO.md will add explicit [tool.uv.sources] in
# each consuming package's pyproject.toml when the local cross-link does not
# resolve automatically.

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
]

[tool.ruff]
# Workspace-level defaults. Per-package overrides win.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Permissive baseline; per-package configs tighten.
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF002", "RUF003"]  # Acgs-Swarm latent_dna.py uses Greek chars

[tool.ruff.lint.per-file-ignores]
# These scripts/tests intentionally do `sys.path.insert(...)` for sibling-script
# imports before any normal import statement (the audit_log / validate_automation
# modules live next to the script, not in an installed package). E402
# (module-level import not at top of file) is the expected price of that idiom;
# ignoring it locally is cleaner than per-line `# noqa: E402` that ruff's `I`
# (import-sort) keeps stripping.
"automation/scripts/install_automation.py" = ["E402"]
"automation/scripts/propose_automation.py" = ["E402"]
"automation/tests/test_automation_system.py" = ["E402"]

[tool.pytest.ini_options]
# Members override; this is the workspace fallback.
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
# Suppress upstream noise unrelated to monorepo tests:
#   - langchain_core imports pydantic.v1 which is incompatible with Py 3.14;
#     the warning fires at import time and clutters test output. We do not
#     own langchain_core; the fix is upstream.
filterwarnings = [
    "ignore::UserWarning:langchain_core.*",
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14:UserWarning",
]
