[project]
name = "hermes-acgs-bundle"
version = "0.1.0"
description = "Hermes and ACGS middleware with chain-hashed evidence writer"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

# Flat-layout package: evidence_writer.py and hermes_acgs_middleware.py are
# top-level modules directly under hermes_acgs_bundle/, not inside a src/ or
# package subdirectory. Hatchling's default wheel builder can't infer a
# packaging target from that layout, so the wheel contents are pinned
# explicitly: the two modules (importable as `import evidence_writer` /
# `import hermes_acgs_middleware`, matching how tests/ already imports them)
# plus the shipped reference constitution.
[tool.hatch.build.targets.wheel]
only-include = ["evidence_writer.py", "hermes_acgs_middleware.py", "constitution.min.yaml"]

[tool.hatch.build.targets.sdist]
include = [
    "evidence_writer.py",
    "hermes_acgs_middleware.py",
    "constitution.min.yaml",
    "tests/",
    "requirements-test.txt",
]
