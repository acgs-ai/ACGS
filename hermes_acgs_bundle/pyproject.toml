[project]
name = "hermes-acgs-bundle"
version = "0.1.0"
description = "Hermes and ACGS middleware with chain-hashed evidence writer"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
