# GitHub Pages configuration for acgs-ai/ACGS.
#
# This repository is a code monorepo, not a documentation site. GitHub Pages is
# configured as a legacy branch build from `master:/`, so without this file
# Jekyll runs with "Configuration file: none" and walks the entire tree —
# including submodule working copies, which the Pages builder checks out.
#
# That is not merely slow, it is fail-prone: any Markdown file anywhere in the
# monorepo that contains a non-Liquid template tag aborts the whole build with a
# Liquid::SyntaxError. Some of that content is legitimately un-editable — for
# example security reference material that must quote `{% ... %}` template
# injection payloads verbatim, and files owned by nested repositories that
# cannot be staged from this parent repo.
#
# The fix is to scope the site to what is actually meant to be published
# (the README, which jekyll-readme-index promotes to the index, plus `docs/`)
# and exclude source trees outright. Excluded paths are never read, so they are
# never parsed as Liquid.

title: ACGS
description: Constitutional AI governance platform — receipt-gated agent execution.

# `exclude` REPLACES Jekyll's built-in defaults rather than extending them, so
# the standard entries are repeated here. Do not drop them.
exclude:
  # --- Jekyll defaults (must be restated) ---
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/

  # --- Source trees: published site must not render these ---
  - acgi-ai/
  - acgs-cft-governance-pack/
  - acgs-enterprise-ai-manager/
  - acgs_benchmark/
  - acgs_governance_eval_mvp/
  - acgs_trajectory/
  - automation/
  - benchmarks/
  - compliance/
  - evidence/
  - examples/
  - experiments/
  - external/
  - hermes_acgs_bundle/
  - infra/
  - packages/
  - requirements/
  - schemas/
  - scripts/
  - specs/
  - tests/
  - tools/
  - worktrees/

  # --- Agent/tooling state, never publishable ---
  - .agents/
  - .benchmarks/
  - .ci-trigger/
  - .claude/
  - .codex/
  - .design-sync/
  - .github/
  - .omc/
  - .superpowers/

  # --- Build manifests ---
  - Makefile
  - package.json
  - pnpm-workspace.yaml
  - pyproject.toml
  - turbo.json

  # --- docs/ pages that quote GitHub Actions expression YAML verbatim ---
  # The github-pages gem processes every Markdown file (via
  # jekyll-optional-front-matter), and Liquid's raw-text pre-pass treats the
  # `{{ ... }}` inside those snippets as its own tags — `||` expressions abort
  # the build with Liquid::SyntaxError, bare lookups silently blank out on the
  # rendered page. These stay readable on github.com; they are excluded from
  # the published site rather than polluted with {% raw %} wrappers.
  - docs/adr/0004-submodule-token-pat-strategy.md
  - docs/audits/phase-3-check-6-amendment-2026-05-13.md
  - docs/design/console-forward-auth-google-idp.md
  - docs/runbooks/submodule-token.md
  - docs/runbooks/submodule-token-v1.md
