[project]
name = "agent-bus-analyzer"
version = "0.1.0"
description = "Observer-only analysis layer for the Enhanced Agent Bus + gove-zone audit chain"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ACGS Team", email = "hello@acgs.dev" }]

dependencies = [
    "pydantic>=2.8",
    "anyio>=4.4",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "enhanced-agent-bus",
]

[tool.uv.sources]
enhanced-agent-bus = { path = "../../ACGS/packages/enhanced_agent_bus", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bus_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/agent_bus_analyzer"]
