[project]
name = "delve"
version = "0.1.0"
description = "A self-deepening research engine: fan-out research, persistent citation-backed knowledge graph, adversarial verification, loop-until-dry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martin" }]
dependencies = []

[project.optional-dependencies]
# Real backends are optional extras; the core engine runs offline with fakes.
anthropic = ["anthropic>=0.40"]
exa = ["exa-py>=1.0"]
tavily = ["tavily-python>=0.5"]
all = ["anthropic>=0.40", "exa-py>=1.0", "tavily-python>=0.5"]

[project.scripts]
delve = "delve.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["delve"]
strict = true

[[tool.mypy.overrides]]
# Optional provider SDKs and the optional gove-zone governance integration are
# imported lazily and only when installed; treat them as untyped so --strict
# doesn't require their stubs or a cross-package dependency.
module = ["anthropic.*", "exa_py.*", "tavily.*", "gove_zone.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy>=2.5 ships PEP 695 `type` statements in its stubs that are only valid for
# a checked-for python_version >= 3.12. With our 3.11 floor (python_version above),
# mypy errors out parsing numpy's own stub before it reaches project code (this
# only surfaces on a 3.12+ interpreter, where the lock installs numpy 2.5.0). Skip
# following numpy so the conservative 3.11 typecheck target is preserved without
# breaking on a third-party stub's newer syntax.
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
