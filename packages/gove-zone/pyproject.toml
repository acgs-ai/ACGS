[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gove-zone"
version = "0.1.0.dev0"
description = "Minimal governed agent runtime — fail-closed governance, receipts, audit chain for AI agent tool calls."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Gove Zone Contributors" }]
keywords = ["ai", "agents", "governance", "audit", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
gove-zone = "gove_zone.cli:main"
gove-zone-api = "gove_zone.api:main"

[project.urls]
Homepage = "https://acgs.ai"
Documentation = "https://acgs.ai/docs"
Repository = "https://github.com/dislovelhl/ACGS"
Issues = "https://github.com/dislovelhl/ACGS/issues"

[project.optional-dependencies]
schema = ["pydantic>=2.0"]
crypto = ["cryptography>=48.0.1"]
mcp = [
    "mcp>=1.28.1,<2",
    "httpcore>=1.0.9,<2",
    "pydantic-settings>=2.14.2",
    "anyio>=4.11",
    "httpx>=0.27.1,<1",
    "starlette>=1.3.1",
    "uvicorn>=0.31.1; sys_platform != 'emscripten'",
    "cryptography>=48.0.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "cryptography>=48.0.1",
    "mcp>=1.28.1,<2",
    "httpcore>=1.0.9,<2",
    "pydantic-settings>=2.14.2",
    "anyio>=4.11",
    "httpx>=0.27.1,<1",
    "starlette>=1.3.1",
    "uvicorn>=0.31.1; sys_platform != 'emscripten'",
]

[tool.hatch.build]
exclude = ["**/.omc/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/gove_zone"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/gove_zone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-q"]
