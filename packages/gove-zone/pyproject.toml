[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gove-zone"
version = "0.1.0.dev0"
description = "Minimal governed agent runtime — fail-closed governance, receipts, audit chain for AI agent tool calls."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Gove Zone Contributors" }]
keywords = ["ai", "agents", "governance", "audit", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
gove-zone = "gove_zone.cli:main"
gove-zone-api = "gove_zone.api:main"

[project.optional-dependencies]
schema = ["pydantic>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gove_zone"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-q"]
