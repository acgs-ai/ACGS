[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acgs-canary"
version = "0.1.0"
description = "R0 canary-provenance tooling: restricted canary store, variant commitments, acceptance ledger, external-anchor interfaces. Private infrastructure; no public effects."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["gove-zone[crypto]"]

[project.scripts]
acgs-canary = "acgs_canary.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv.sources]
gove-zone = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/acgs_canary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
