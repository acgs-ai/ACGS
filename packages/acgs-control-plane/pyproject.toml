[project]
name = "acgs-control-plane"
version = "0.1.0"
description = "ACGS Enterprise Governance Control Plane — multi-tenant, receipt-gated management API over the gove-zone kernel"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ACGS Team", email = "hello@acgs.dev" }]

dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=42",
    "fastapi>=0.110",
    "pydantic[email]>=2.8",
    "sqlalchemy>=2.0",
    "gove-zone",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
server = ["uvicorn>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv.sources]
gove-zone = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acgs_control_plane"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.11"
files = ["src/acgs_control_plane"]
strict = false
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# gove-zone ships no py.typed marker yet; silence import-untyped only.
module = "gove_zone.*"
ignore_missing_imports = true
