[alembic]
# Migration resources ship inside the Python package so an installed wheel has
# the same history and environment as a source checkout.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os

# A target is deliberately not hard-coded. Supply an explicit URL through the
# package helper rather than allowing a migration to select an arbitrary local
# default.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
