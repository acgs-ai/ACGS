[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acgs-proofpack-verifier"
version = "0.1.0a1"
description = "Dependency-minimal offline verifier for ACGS proof packs — validates a governance evidence bundle WITHOUT installing gove-zone."
readme = "README.md"
license = { text = "Apache-2.0" }
# Ship the license text in the sdist and wheel. Without this, hatchling built
# artifacts that declared Apache-2.0 and carried no license file — a relying
# party installing only the wheel had the claim and not the grant.
license-files = { paths = ["LICENSE"] }
requires-python = ">=3.11"
# acgs.dev is registered but publishes no MX record, so this address had no mail
# route; acgs.dev delivery would fall back to its A record, a web host. acgs.ai
# has Cloudflare email routing. For the package an auditor is told to trust, the
# contact address has to actually reach someone.
authors = [{ name = "ACGS Team", email = "hello@acgs.ai" }]
keywords = ["ai", "governance", "audit", "proof-pack", "verifier", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# Zero runtime dependencies by design. The whole point of this package is that a
# relying party (auditor, regulator, CI gate) can verify a proof pack offline
# without pulling in the gove-zone policy engine. Ed25519 signature checks need
# `cryptography`; it is an OPTIONAL extra so unsigned-pack verification stays
# dependency-free.
dependencies = []

[project.scripts]
acgs-verify = "acgs_proofpack_verifier.cli:main"

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = [
    "pytest>=7.0",
    "cryptography>=42",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://acgs.ai"
# Canonical owner is acgs-ai (confirmed via `gh api repos/... --jq .full_name`).
# The old dislovelhl/ path only resolves through a GitHub rename redirect, and a
# redirect stops redirecting the moment anyone recreates that name — which would
# repoint this package's PyPI "Repository" link at a repo we do not control.
Repository = "https://github.com/acgs-ai/ACGS"
Issues = "https://github.com/acgs-ai/ACGS/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/acgs_proofpack_verifier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Mirrors packages/gove-zone: the src/ modules are a vendored snapshot of the
# gove-zone verify surface and already satisfy this rule set.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-q"]
