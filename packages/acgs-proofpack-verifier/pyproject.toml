[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acgs-proofpack-verifier"
version = "0.1.0a1"
description = "Dependency-minimal offline verifier for ACGS proof packs — validates a governance evidence bundle WITHOUT installing gove-zone."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "ACGS Team", email = "hello@acgs.dev" }]
keywords = ["ai", "governance", "audit", "proof-pack", "verifier", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# Zero runtime dependencies by design. The whole point of this package is that a
# relying party (auditor, regulator, CI gate) can verify a proof pack offline
# without pulling in the gove-zone policy engine. Ed25519 signature checks need
# `cryptography`; it is an OPTIONAL extra so unsigned-pack verification stays
# dependency-free.
dependencies = []

[project.scripts]
acgs-verify = "acgs_proofpack_verifier.cli:main"

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = [
    "pytest>=7.0",
    "cryptography>=42",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://acgs.ai"
Repository = "https://github.com/dislovelhl/ACGS"
Issues = "https://github.com/dislovelhl/ACGS/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/acgs_proofpack_verifier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Mirrors packages/gove-zone: the src/ modules are a vendored snapshot of the
# gove-zone verify surface and already satisfy this rule set.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-q"]
